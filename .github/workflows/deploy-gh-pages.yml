name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish ASCII Hero.Client (standalone)
        run: dotnet publish "ASCII Hero/ASCII Hero.Client/ASCII Hero.Client.csproj" -c Release -o publish -p:StandaloneBuild=true

      # Lists every asset file so the game never requests the optional files a world doesn't
      # have (GitHub Pages sometimes answers such requests with a 503 instead of a 404).
      - name: Write asset manifest
        shell: pwsh
        run: |
          $root = (Resolve-Path "publish/wwwroot").Path
          $paths = Get-ChildItem "$root/Assets" -Recurse -File | ForEach-Object { $_.FullName.Substring($root.Length + 1).Replace('\', '/') } | Sort-Object
          [IO.File]::WriteAllLines("$root/Assets/manifest.txt", $paths)

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
