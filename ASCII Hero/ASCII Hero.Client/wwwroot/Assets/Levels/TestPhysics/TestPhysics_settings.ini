[Level]
Title = Test Physics

[Layout]
EmptyChar = '.' ; Non-space so a cell can be left blank in a grid file without relying on
				; trailing spaces - still renders as fully transparent either way.

[Colors]
; Fallback color for any cell that has no color of its own and whose sprite has no default
; color either.
DefaultForegroundColor = G
; DefaultBackgroundColor left unset, so those cells stay fully transparent.

[Physics]
; Four balls, each dropped straight down onto a floor segment of a different material, so the
; resulting bounce height/settle time can be compared side by side. Uses normal gravity - unlike
; TestMovement's weightless enclosed-box setup, these balls are meant to fall and land, not
; bounce forever.
Gravity = 40 ; Default is 40

[Animation]
FrameDurationSeconds = 0.4
Mode = Loop
