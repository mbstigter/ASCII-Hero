
[ObjectCodes]
0 = Player
1 = BouncingBall
2 = WallHorizontal
3 = WallVertical
4 = TestCollectable
5 = ToxicPlant
6 = Ladder
7 = MiddleWall
8 = HangingPipe

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
; Plays the Player asset's "spark" clip as a cosmetic effect overlaying the player on an
; ordinary (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side or below.
EffectClip = spark

[WallHorizontal]
Asset = SteelPlatform
Clip = default
Kind = StaticObject
; Authored as a 1-wide tileable unit (TileAxis = Horizontal); Repeat spans the
; full 120-cell width of the expanded test box for the top/bottom walls (widened
; from the original 80 to bring back horizontal side-scrolling).
Repeat = 120

[WallVertical]
Asset = BrickWall
Clip = default
Kind = StaticObject
; Authored as a 1-tall tileable unit (TileAxis = Vertical); Repeat spans the
; area between the top/bottom walls for the left/right walls.
Repeat = 22

[Ladder]
Asset = Ladder
Clip = default
Kind = StaticObject
; Authored as a 1-wide tileable unit (TileAxis = Vertical); Repeat spans from a
; bit above MiddleWall's top down to the floor, so the player can approach it
; either from the ground or by falling onto MiddleWall from above and
; stepping/jumping sideways onto the ladder.
Repeat = 7
Passable = true
Climbable = true

[MiddleWall]
Asset = BrickWall
Clip = default
Kind = StaticObject
; Two of these are placed a few cells apart in the middle of the world (not
; spanning the full height like WallVertical) purely to test landing on/
; falling onto a mid-height solid, and stepping off it onto the ladder/pipe.
Repeat = 4

[HangingPipe]
Asset = Pipe
Clip = default
Kind = StaticObject
; Authored as a 1-tall tileable unit (TileAxis = Horizontal); Repeat spans the
; gap between the two MiddleWall placements, at a height reachable by jumping
; from the floor between them.
Repeat = 8
Passable = true
Hangable = true

[BouncingBall]
Asset = Ball
Clip = default
Kind = DynamicObject
; Same "weightless, perfectly elastic" placeholder tuning as Level1's ball -
; isolated here (no other platforms, fully enclosed box) to observe whether it
; keeps bouncing forever or ends up settled in a corner.
GravityAffected = false
Restitution = 1.0
InitialVelocityX = 14
InitialVelocityY = 10

[TestCollectable]
; Throwaway placement proving the generic Collectable removal plumbing works
; end-to-end: walk the player into it and it should disappear (queued for
; removal by CollisionSystem, applied via World2D.ApplyPendingRemovals).
Asset = Ring
Clip = default
Kind = Collectable
; Plays the Ring asset's "fade" clip (same shape, dimming color) at the ring's position when
; picked up - see EffectInstance2D/IEffectTrigger.
EffectClip = fade

[ToxicPlant]
Asset = ToxicPlant
Clip = idle
Kind = StaticEnemy
; Landing on top of this instance kills it (see IKillableBody) instead of just registering as an
; ordinary hazard hit. EffectClip plays the "crumble" clip on the kill contact specifically;
; EffectPersists keeps the resulting husk (shrunk to a residue on the bottom row) in the world
; permanently instead of it self-removing like an ordinary effect.
Killable = true
EffectClip = crumble
EffectPersists = true

