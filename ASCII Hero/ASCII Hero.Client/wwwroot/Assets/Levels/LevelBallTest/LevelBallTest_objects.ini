[ObjectCodes]
0 = PlayerSpawn
1 = BouncingBall
2 = WallHorizontal
3 = WallVertical

[PlayerSpawn]
Asset = Player
Clip = idle
; Subject to normal world gravity.
Gravity = true

[WallHorizontal]
Asset = SteelPlatform
Clip = default
Static = true
; Authored as a 1-wide tileable unit (TileAxis = Horizontal); Repeat spans the
; full 80-cell width of the enclosed test box for the top/bottom walls.
Repeat = 80

[WallVertical]
Asset = BrickWall
Clip = default
Static = true
; Authored as a 1-tall tileable unit (TileAxis = Vertical); Repeat spans the
; area between the top/bottom walls for the left/right walls.
Repeat = 22

[BouncingBall]
Asset = Ball
Clip = default
Static = false
; Same "weightless, perfectly elastic" placeholder tuning as Level1's ball -
; isolated here (no other platforms, fully enclosed box) to observe whether it
; keeps bouncing forever or ends up settled in a corner.
Gravity = false
Restitution = 1.0
InitialVelocityX = 14
InitialVelocityY = 10
; The camera follows this ball instead of the (stationary, off to the side)
; player, so its full bounce path stays visible.
CameraTarget = true
