[Layout]
EmptyChar = '.' ; Non-space so authored grid files can end lines right after their last marker
                ; without depending on trailing spaces surviving file edits/whitespace-trimming
                ; tools - still renders as fully transparent, same as any other EmptyChar choice.

[Physics]
; Weightless ball moving in a fully enclosed box - gravity here is irrelevant to
; the ball (Gravity=false on BouncingBall) but still applies to the player.
Gravity = 40 ; Default is 40
