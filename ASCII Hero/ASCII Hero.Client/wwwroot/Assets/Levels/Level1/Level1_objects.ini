[ObjectCodes]
0 = PlayerSpawn
1 = SteelPlatform
2 = BrickWall
3 = BouncingBall
4 = ToxicPlant
5 = SteelPlatformShort
6 = BrickWallShort

[PlayerSpawn]
Asset = Player
Clip = idle
; Subject to normal world gravity.
Gravity = true

[SteelPlatform]
Asset = SteelPlatform
Clip = default
Static = true
; Authored as a 1-wide tileable unit (TileAxis = Horizontal in SteelPlatform_settings.ini);
; Repeat builds up the actual platform length at spawn time. Chosen so consecutive
; platforms in the staircase are close enough to jump across.
Repeat = 8

[SteelPlatformShort]
Asset = SteelPlatform
Clip = default
Static = true
Repeat = 4

[BrickWall]
Asset = BrickWall
Clip = default
Static = true
; Authored as a 1-tall tileable unit (TileAxis = Vertical in BrickWall_settings.ini);
; Repeat builds up the actual wall height at spawn time.
Repeat = 6

[BrickWallShort]
Asset = BrickWall
Clip = default
Static = true
Repeat = 3

[BouncingBall]
Asset = Ball
Clip = default
Static = false
; Effectively weightless: bounces around forever instead of settling under
; normal world gravity. Tuned later once the physics engine considers per-object
; gravity scale properly - for now this is a placeholder intent marker.
Gravity = false
Restitution = 1.0
InitialVelocityX = 14
InitialVelocityY = 10

[ToxicPlant]
Asset = ToxicPlant
Clip = idle
; idle has 3 frames (left/middle/right shape variants); Frame selects which one
; this placed instance uses. Frame 1 = the middle/straight variant.
Frame = 1
Static = true
