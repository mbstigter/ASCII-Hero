[Layout]
EmptyChar = ' ' ; Default is ' '

[Colors]
; Falls back further than any sprite's own [Colors] defaults (see e.g. Ball_settings.ini) - only
; applies to a cell whose own color code is absent/empty AND whose sprite has no default of its
; own either. Set to a green close to the hardcoded renderer fallback purely so this level's
; intent is explicit rather than implicit; change freely.
DefaultForegroundColor = G
; DefaultBackgroundColor left unset - hardcoded fallback (no fill, fully transparent) applies.

[Physics]
Gravity = 40 ; Default is 40
