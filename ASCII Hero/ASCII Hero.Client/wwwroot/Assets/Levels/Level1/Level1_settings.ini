[Level]
Title = The Mountains

[Layout]
EmptyChar = '.' ; Non-space so a cell can be left blank in a grid file without relying on
				; trailing spaces - still renders as fully transparent either way.

[Colors]
; Fallback color for any cell that has no color of its own and whose sprite has no default
; color either.
DefaultForegroundColor = G
; DefaultBackgroundColor left unset - hardcoded fallback (no fill, fully transparent) applies.

[Physics]
Gravity = 40 ; Default is 40

[Animation]
FrameDurationSeconds = 0.5
Mode = PingPong