[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Flesh

[Animation]
FrameDurationSeconds = 0.25
Mode = Loop

[Stances]
Default = Move
; The snake's single stance: idle stays put, left/right play while patrolling so its body
; visibly turns to face the direction it is currently slithering in - see docs/AssetFormat.md
; §2.6 for how each clip's own suffix (_idle/_left/_right) maps to a facing.
Move = move_idle, move_left, move_right
