[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Snake

[Animation]
FrameDurationSeconds = 0.25
Mode = Loop

; While it moves, its animation steps to the next frame every 1.5 cells travelled, so it
; keeps pace with the ground at any speed and holds still while it is stopped.
[Animation.move_left]
CellsPerFrame = 1.5

[Animation.move_right]
CellsPerFrame = 1.5

[Poses]
Default = Move
; The snake's single pose: idle stays put, left/right play while patrolling so its body
; visibly turns to face the direction it is currently slithering in - see docs/AssetFormat.md
; §2.6 for how each clip's own suffix (_idle/_left/_right) maps to a facing.
Move = move_idle, move_left, move_right
