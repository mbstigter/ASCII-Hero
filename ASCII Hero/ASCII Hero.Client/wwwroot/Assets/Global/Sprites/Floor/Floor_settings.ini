[Layout]
EmptyChar = ' '
; Cells drawn with this character show the floor's material, so one drawing serves every material.
MaterialChar = '^'

; One style per clip (ancient, ...), each with a _decayed variant that has chipped edges. Floors are
; 1 cell thick and repeat sideways in an 8-cell unit: set the length with Span, preferably a
; multiple of 8 for a clean end.
TileAxis = Horizontal

[Physics]
DefaultMaterial = AncientStone

[Colors]
DefaultBackgroundColor = None
