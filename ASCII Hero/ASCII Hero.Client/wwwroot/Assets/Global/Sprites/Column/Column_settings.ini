[Layout]
EmptyChar = ' '
; Cells drawn with this character show the column's material, so one drawing serves every material.
MaterialChar = '^'

; The shaft repeats downward: set its height with Span. Put a ColumnCapital on top and a
; ColumnBase below it. Half blocks on both sides make the shaft look slimmer than the
; 3 cells it occupies. The _decayed variant is 8 rows tall with a few chips, alternating left and right.
TileAxis = Vertical

[Physics]
DefaultMaterial = AncientStone

[Colors]
DefaultBackgroundColor = None
