[Layout]
EmptyChar = ' '
; Grass strips repeat sideways in a 16-cell unit; set the length with Span. Use a multiple of
; 16 for a clean end.
; floor_*   - tufts growing up from a floor: place directly on top of it.
; hanging_* - tufts hanging down from a ceiling: place directly below it.
; Each comes in green (dark tips, light base), brown (dry, withered) and toxic (green with
; alternating red and orange tips) tones.
TileAxis = Horizontal

[Physics]
DefaultMaterial = Plant
