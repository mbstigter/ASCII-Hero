[Layout]
EmptyChar = ' '

; Horizontal ropes repeat sideways, vertical ropes repeat downward.
; The plain clips stand still and are a 2-cell unit. The direction clips are a 3-cell unit with a
; light strand that travels along the rope, for ropes whose line keeps running: pick the clip that
; matches the way the line moves.
[Layout.horizontal]
TileAxis = Horizontal

[Layout.horizontal_right]
TileAxis = Horizontal

[Layout.horizontal_left]
TileAxis = Horizontal

[Layout.vertical]
TileAxis = Vertical

[Layout.vertical_up]
TileAxis = Vertical

[Layout.vertical_down]
TileAxis = Vertical

[Physics]
DefaultMaterial = Rope

[Animation]
FrameDurationSeconds = 0.15
Mode = Loop
