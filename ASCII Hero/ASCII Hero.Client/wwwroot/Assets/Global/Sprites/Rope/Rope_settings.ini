[Layout]
EmptyChar = ' '

; Horizontal ropes repeat sideways, vertical ropes repeat downward.
; The plain clips stand still and are a 2-cell unit. The direction clips are a 3-cell unit with a
; light strand that travels along the rope, for ropes whose line keeps running: pick the clip that
; matches the way the line moves.
[Layout.horizontal]
TileAxis = Horizontal

[Layout.horizontal_right]
TileAxis = Horizontal

[Layout.horizontal_left]
TileAxis = Horizontal

[Layout.vertical]
TileAxis = Vertical

[Layout.vertical_up]
TileAxis = Vertical

[Layout.vertical_down]
TileAxis = Vertical

[Physics]
DefaultMaterial = Rope

[Animation]
FrameDurationSeconds = 0.15
Mode = Loop

; The light strand of a running rope moves one cell for every cell the line runs, so it travels at
; exactly the rope's speed and a hanging or climbing hero's hands stay put on it. The frame time
; above is only used for a running clip on a rope that has no speed set.
[Animation.horizontal_left]
CellsPerFrame = 1

[Animation.horizontal_right]
CellsPerFrame = 1

[Animation.vertical_up]
CellsPerFrame = 1

[Animation.vertical_down]
CellsPerFrame = 1
