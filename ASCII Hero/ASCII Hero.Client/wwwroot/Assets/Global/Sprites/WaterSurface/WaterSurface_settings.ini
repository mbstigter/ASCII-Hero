[Layout]
EmptyChar = ' '

; The surfaces repeat sideways, the waterfall repeats downward.
; "still" is still water with gently rippling waves. "horizontal_left"/"horizontal_right" are
; water flowing that way, and "vertical_down" is a falling waterfall: their waves travel along in
; 3-cell units, so pick the clip that matches the way the water flows.
[Layout.still]
TileAxis = Horizontal

[Layout.horizontal_left]
TileAxis = Horizontal

[Layout.horizontal_right]
TileAxis = Horizontal

[Layout.vertical_down]
TileAxis = Vertical

[Physics]
DefaultMaterial = Water

; Still water ripples gently on a timer.
[Animation]
FrameDurationSeconds = 0.4
Mode = Loop

; The flowing clips can be used in two ways:
; - As real flowing water (Kind = FlowZone, with a FlowSpeed): the waves follow the flow.
;   CellsPerFrame is how many cells the water flows per wave step, so the waves move at
;   FlowSpeed / CellsPerFrame cells per second, and change speed by themselves when FlowSpeed is
;   changed. While the flow is switched off the waves hold still. The frame time is not used.
; - As decoration only (any other Kind, no flow): there is no flow to follow, so the waves step
;   on the frame time instead.

; Surface waves move at a third of the flow speed, about as fast as things floating in the water
; actually drift along. As decoration they step every 0.25 seconds, which looks the same as a
; river with FlowSpeed 12.
[Animation.horizontal_left]
CellsPerFrame = 3
FrameDurationSeconds = 0.25

[Animation.horizontal_right]
CellsPerFrame = 3
FrameDurationSeconds = 0.25

; A waterfall's streaks move at the full flow speed. As decoration they step every 0.15 seconds,
; so the waterfall falls faster than surface waves move.
[Animation.vertical_down]
CellsPerFrame = 1
FrameDurationSeconds = 0.15
