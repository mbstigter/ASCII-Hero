[Layout]
EmptyChar = ' '

; The horizontal surface repeats sideways, the vertical waterfall repeats downward.
[Layout.horizontal]
TileAxis = Horizontal

[Layout.vertical]
TileAxis = Vertical

[Physics]
DefaultMaterial = Water

[Animation]
FrameDurationSeconds = 0.4
Mode = Loop

; The waterfall flows faster than the surface ripples.
[Animation.vertical]
FrameDurationSeconds = 0.15
