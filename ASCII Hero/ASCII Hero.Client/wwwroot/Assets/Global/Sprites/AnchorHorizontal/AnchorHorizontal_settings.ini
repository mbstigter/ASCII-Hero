[Layout]
EmptyChar = ' '

; A rounded stone block, 3x3 cells, for tying off a stretched rope. The middle mark shows the direction.
; *_left  stands at the left end of the rope: place the rope directly right of it, in its middle row.
; *_right stands at the right end of the rope: place it directly right of the rope, with its middle row
;         level with the rope.

[Physics]
DefaultMaterial = AncientStone

[Colors]
DefaultBackgroundColor = None
