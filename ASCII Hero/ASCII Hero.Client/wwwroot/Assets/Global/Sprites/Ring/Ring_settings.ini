[Layout]
EmptyChar = ' '

[Animation]
FrameDurationSeconds = 0.25
Mode = PingPong

; Played as a one-off cosmetic effect (see IEffectTrigger/EffectClipName) when this ring is
; picked up - same silhouette as the default clip, fading from bright to dim yellow across its
; 3 frames. Loop is fine here even though the effect only ever plays once: the whole
; EffectInstance2D self-removes exactly when its lifetime (frameCount * FrameDurationSeconds)
; elapses, which lines up with exactly one full pass through the clip.
[Animation.fade]
FrameDurationSeconds = 0.15
Mode = Loop
