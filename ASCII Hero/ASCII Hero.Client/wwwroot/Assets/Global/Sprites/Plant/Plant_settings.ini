[Layout]
EmptyChar = ' '
; medium - a 3-wide, 3-tall plant swaying in the wind.
; small  - a 1-wide, 2-tall sprout swaying along with it.

[Physics]
DefaultMaterial = Plant

[Animation]
FrameDurationSeconds = 0.5
Mode = PingPong
DefaultFrame = 1

; Played when the plant is squashed from above: it shrinks down to a flat husk over 3 steps and
; then stays that way. Plays once and holds the last frame, so the plant never springs back up.
[Animation.crumble]
FrameDurationSeconds = 0.2
Mode = Once
DefaultFrame = 0