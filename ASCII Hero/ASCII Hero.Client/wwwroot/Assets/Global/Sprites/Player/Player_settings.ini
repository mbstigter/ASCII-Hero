[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Flesh

[Animation]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.walk_left]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.walk_right]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

; Head sway while hanging still, mirroring the walk_idle head-turn: 3 frames (left/center/right),
; PingPong so it settles back through center rather than snapping.
[Animation.hang_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.clamber_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

; Head sway while holding still on a ladder (not pressing up/down), mirroring the walk_idle
; head-turn: 3 frames (left/center/right), PingPong so it settles back through center.
[Animation.climb_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

; Alternating arm position while actually climbing up - a simple 2-frame loop, no PingPong
; needed since either frame reads fine as the "resting" pose to hold on between arm-swaps.
[Animation.climb_up]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

; Same arm-over-arm motion as climb_up (climbing reads the same whichever direction the arms are
; alternating), kept as its own clip/file pair so distinct down-climbing art can be authored later
; without any code or [Stances] change.
[Animation.climb_down]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.hang_left]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.hang_right]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.clamber_left]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.clamber_right]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

; Played as a one-off cosmetic effect (see IEffectTrigger/EffectClipName) on an ordinary
; (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side. A small flickering
; spark overlaying the player's position - Loop is fine since the whole EffectInstance2D
; self-removes exactly when its lifetime (frameCount * FrameDurationSeconds) elapses, lining up
; with one full pass through the clip.
[Animation.spark]
FrameDurationSeconds = 0.1
Mode = Loop

[Stances]
Default = Walk
; Every stance listed here is mandatory: PhysicsSystem can put the player into any of them at
; any time (e.g. Clamber as soon as a hangable surface is grabbed while crawling), so a missing
; stance/clip is a hard load or runtime error, not a silent fallback - see docs/AssetFormat.md
; §2.6. Each clip requires at least a matching *_characters.txt file; the matching
; *_foregroundcolors.txt/*_backgroundcolors.txt layers are optional per clip.
; Each clip's own suffix says which facing it's for (_idle/_left/_right/_up/_down - see
; docs/AssetFormat.md §2.6), so a stance simply lists whichever facings it actually has art for,
; in any order. Climb faces vertically (climbing) rather than sideways, so it lists _up/_down
; instead of _left/_right - no separate flag needed.
Walk = walk_idle, walk_left, walk_right
Crawl = crawl_idle, crawl_left, crawl_right
Jump = jump_idle, jump_left, jump_right
Climb = climb_idle, climb_up, climb_down
Hang = hang_idle, hang_left, hang_right
Clamber = clamber_idle, clamber_left, clamber_right

; Optional per-clip-prefix subfolders (see docs/AssetFormat.md §2.7), used here because Player
; has grown enough stances/clips to be worth grouping by stance instead of a single flat folder.
; "walk" matches walk_idle/walk_left/walk_right, etc. Clips without a matching prefix here
; (e.g. "spark") are read straight from the asset's own root folder.
[ClipFolders]
walk = Walk
crawl = Crawl
jump = Jump
climb = Climb
clamber = Clamber
hang = Hang

