[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Human

; Moving clips (left/right/up/down) use CellsPerFrame instead of a frame time: the limbs step to
; the next frame each time the player has travelled that many cells, so they always keep pace with
; the ground (or ladder, rope or water) they push against, at any speed - including speeding up,
; being blocked, or riding a running rope or flowing water. Standing still holds the frame.
; Walking, crawling, climbing, hanging and clambering share the same 2.4-cell stride. Swimming
; uses a longer 5.4-cell glide per stroke, for fewer, more stretched-out strokes.
; Idle clips and the jump clips stay on a frame time.
[Animation]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.walk_left]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.walk_right]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.crawl_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.crawl_left]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.crawl_right]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.hang_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.clamber_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.climb_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.climb_up]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.climb_down]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.hang_left]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.hang_right]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.clamber_left]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.clamber_right]
CellsPerFrame = 2.4
Mode = Loop
DefaultFrame = 0

[Animation.swim_idle]
FrameDurationSeconds = 0.75
Mode = PingPong
DefaultFrame = 2

[Animation.swim_left]
CellsPerFrame = 5.4
Mode = Loop
DefaultFrame = 0

[Animation.swim_right]
CellsPerFrame = 5.4
Mode = Loop
DefaultFrame = 0

[Animation.swim_up]
CellsPerFrame = 5.4
Mode = Loop
DefaultFrame = 0

[Animation.swim_down]
CellsPerFrame = 5.4
Mode = Loop
DefaultFrame = 0

; Effects below are short cosmetic clips shown over the player in certain situations. They follow
; the player while they play.
; - EffectDurationSeconds: total time the effect plays before it disappears; the clip loops for
;   that long. If omitted, it plays exactly one pass through its frames.
; - OffsetX/OffsetY: shift of the effect relative to the player, in cells (negative OffsetY =
;   higher up).
; - TintColor: recolors the player while the effect plays. With TintBlinkSeconds it blinks between
;   TintColor and TintAlternateColor (or the player's normal colors when no alternate is given),
;   switching every TintBlinkSeconds.

; Played on an ordinary (non-fatal) hazard contact, e.g. bumping into a toxic plant from the side.
; A small flickering spark above the player, while the player glows red/orange.
[Animation.hurt]
EffectDurationSeconds = 0.6
FrameDurationSeconds = 0.1
Mode = Loop
OffsetX = 0
OffsetY = -2
TintColor = L
TintAlternateColor = M
TintBlinkSeconds = 0.1

; Played over the player when a checkpoint is reached. The player blinks green.
[Animation.checkpointreached]
EffectDurationSeconds = 1.0
FrameDurationSeconds = 0.1
Mode = Loop
OffsetX = 0
OffsetY = -2
TintColor = E
;TintAlternateColor = 3
TintBlinkSeconds = 0.1

; Played over the player when a level end is reached. The player blinks gold.
[Animation.levelendreached]
EffectDurationSeconds = 1.0
FrameDurationSeconds = 0.1
Mode = Loop
OffsetX = 0
OffsetY = -2
TintColor = Y
;TintAlternateColor = 3
TintBlinkSeconds = 0.1

; Played over the player when a life is lost, before they respawn (or the game ends). The player
; blinks grey.
[Animation.died]
EffectDurationSeconds = 1.0
FrameDurationSeconds = 0.2
Mode = Loop
OffsetX = 0
OffsetY = -2
TintColor = 2
TintAlternateColor = U
TintBlinkSeconds = 0.1

; Played when a health pack restores the player's health. A small green health bar above the
; player fills up and stays full until the effect ends, while the player blinks light/leaf green.
[Animation.healed]
EffectDurationSeconds = 0.8
FrameDurationSeconds = 0.25
Mode = Once
OffsetX = 0
OffsetY = -2
TintColor = F
TintAlternateColor = E
TintBlinkSeconds = 0.1

[Poses]
Default = Walk
; Every pose listed here is mandatory: PhysicsSystem can put the player into any of them at
; any time (e.g. Clamber as soon as a hangable surface is grabbed while crawling), so a missing
; pose/clip is a hard load or runtime error, not a silent fallback - see docs/AssetFormat.md
; Â§2.6. Each clip requires at least a matching *_characters.txt file; the matching
; *_foregroundcolors.txt/*_backgroundcolors.txt layers are optional per clip.
; Each clip's own suffix says which facing it's for (_idle/_left/_right/_up/_down - see
; docs/AssetFormat.md Â§2.6), so a pose simply lists whichever facings it actually has art for,
; in any order. Climb faces vertically (climbing) rather than sideways, so it lists _up/_down
; instead of _left/_right - no separate flag needed.
; IMPORTANT: every clip's frame(s) across every pose below must share the same width/height
; (currently a 3-wide x 3-tall box for every Player clip) - see docs/AssetFormat.md Â§2.6. Frame
; *count* is independent per clip (e.g. an idle clip's 3-frame head-turn vs. a 2-frame walk/crawl
; cycle) and is unaffected by this. Position is not re-anchored on a size change, so an actually
; smaller/larger clip (e.g. Crawl) would float above or sink into the ground. Crawl conveys its
; crouched look via a blank top row within the same full-size box, not a smaller grid.
Walk = walk_idle, walk_left, walk_right
Crawl = crawl_idle, crawl_left, crawl_right
Jump = jump_idle, jump_left, jump_right
Climb = climb_idle, climb_up, climb_down
Hang = hang_idle, hang_left, hang_right
Clamber = clamber_idle, clamber_left, clamber_right
Swim = swim_idle, swim_left, swim_right, swim_up, swim_down

; Optional per-clip-prefix subfolders (see docs/AssetFormat.md Â§2.7), used here because Player
; has grown enough poses/clips to be worth grouping by pose instead of a single flat folder.
; "walk" matches walk_idle/walk_left/walk_right, etc. Clips without a matching prefix here
; (e.g. the "hurt" effect clip) are read from the Player root folder.
[ClipFolders]
walk = Walk
crawl = Crawl
jump = Jump
climb = Climb
clamber = Clamber
hang = Hang
swim = Swim

; Very subtle movement sounds (names from Global/SoundLibrary.ini), keyed by pose. The sound plays
; each time the player's animation steps to its next frame while moving, so the rhythm follows the
; pose's speed automatically. A pose without an entry stays silent, and so does standing still.
[Sounds]
Walk = Step
Crawl = SoftStep
Climb = Grab
Hang = Grab
Clamber = Grab
Swim = Splash
; Played once when the player leaves the ground upward, and once when landing again.
JumpStart = Jump
Land = Land
; Played when the player lands from too high and gets hurt by the fall.
HardLanding = Hurt