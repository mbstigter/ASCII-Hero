[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Human

; A moving (non-idle, left/right/up/down) clip's FrameDurationSeconds is deliberately tied to how
; fast that pose actually moves, so every stance's legs/arms cycle at a pace matching its own
; travelling speed rather than all shuffling at the same rate: FrameDurationSeconds = 2.4 / speed,
; where speed is that pose's own move speed (in cells/second, see GameDefaults.cs) and 2.4 is
; walk_left/walk_right's own speed (12) times its FrameDurationSeconds (0.2), i.e. Walk is the
; anchor every other pose's animation speed is scaled against. If a move speed changes, its
; matching clip(s) below should be recomputed from this same formula to stay in sync:
;   walk_left/right    (WalkSpeed = 12.0)          -> 0.20
;   crawl_left/right    (CrawlSpeed = 6.0)          -> 0.40
;   climb_up/down       (ClimbVerticalSpeed = 10.0) -> 0.24
;   hang_left/right     (HangSpeed = 8.0)           -> 0.30
;   clamber_left/right  (ClamberSpeed = 5.0)        -> 0.48
;   swim_left/right     (SwimHorizontalSpeed = 9.0) -> 0.27
;   swim_up/down        (SwimVerticalSpeed = 5.0)   -> 0.48
[Animation]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.walk_left]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.walk_right]
FrameDurationSeconds = 0.2
Mode = Loop
DefaultFrame = 0

[Animation.crawl_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.crawl_left]
FrameDurationSeconds = 0.4
Mode = Loop
DefaultFrame = 0

[Animation.crawl_right]
FrameDurationSeconds = 0.4
Mode = Loop
DefaultFrame = 0

[Animation.hang_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.clamber_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.climb_idle]
FrameDurationSeconds = 1.5
Mode = PingPong
DefaultFrame = 1

[Animation.climb_up]
FrameDurationSeconds = 0.24
Mode = Loop
DefaultFrame = 0

[Animation.climb_down]
FrameDurationSeconds = 0.24
Mode = Loop
DefaultFrame = 0

[Animation.hang_left]
FrameDurationSeconds = 0.3
Mode = Loop
DefaultFrame = 0

[Animation.hang_right]
FrameDurationSeconds = 0.3
Mode = Loop
DefaultFrame = 0

[Animation.clamber_left]
FrameDurationSeconds = 0.48
Mode = Loop
DefaultFrame = 0

[Animation.clamber_right]
FrameDurationSeconds = 0.48
Mode = Loop
DefaultFrame = 0

[Animation.swim_idle]
FrameDurationSeconds = 0.75
Mode = PingPong
DefaultFrame = 2

[Animation.swim_left]
FrameDurationSeconds = 0.27
Mode = Loop
DefaultFrame = 0

[Animation.swim_right]
FrameDurationSeconds = 0.27
Mode = Loop
DefaultFrame = 0

[Animation.swim_up]
FrameDurationSeconds = 0.48
Mode = Loop
DefaultFrame = 0

[Animation.swim_down]
FrameDurationSeconds = 0.48
Mode = Loop
DefaultFrame = 0

; Played as a one-off cosmetic effect
; (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side. A small flickering
; spark overlaying the player's position - Loop is fine since the whole EffectInstance2D
; self-removes exactly when its lifetime (frameCount * FrameDurationSeconds) elapses, lining up
; with one full pass through the clip.
[Animation.spark]
FrameDurationSeconds = 0.1
Mode = Loop

[Animation.happy]
FrameDurationSeconds = 0.1
Mode = Loop

[Poses]
Default = Walk
; Every pose listed here is mandatory: PhysicsSystem can put the player into any of them at
; any time (e.g. Clamber as soon as a hangable surface is grabbed while crawling), so a missing
; pose/clip is a hard load or runtime error, not a silent fallback - see docs/AssetFormat.md
; §2.6. Each clip requires at least a matching *_characters.txt file; the matching
; *_foregroundcolors.txt/*_backgroundcolors.txt layers are optional per clip.
; Each clip's own suffix says which facing it's for (_idle/_left/_right/_up/_down - see
; docs/AssetFormat.md §2.6), so a pose simply lists whichever facings it actually has art for,
; in any order. Climb faces vertically (climbing) rather than sideways, so it lists _up/_down
; instead of _left/_right - no separate flag needed.
; IMPORTANT: every clip's frame(s) across every pose below must share the same width/height
; (currently a 3-wide x 3-tall box for every Player clip) - see docs/AssetFormat.md §2.6. Frame
; *count* is independent per clip (e.g. an idle clip's 3-frame head-turn vs. a 2-frame walk/crawl
; cycle) and is unaffected by this. Position is not re-anchored on a size change, so an actually
; smaller/larger clip (e.g. Crawl) would float above or sink into the ground. Crawl conveys its
; crouched look via a blank top row within the same full-size box, not a smaller grid.
Walk = walk_idle, walk_left, walk_right
Crawl = crawl_idle, crawl_left, crawl_right
Jump = jump_idle, jump_left, jump_right
Climb = climb_idle, climb_up, climb_down
Hang = hang_idle, hang_left, hang_right
Clamber = clamber_idle, clamber_left, clamber_right
Swim = swim_idle, swim_left, swim_right, swim_up, swim_down

; Optional per-clip-prefix subfolders (see docs/AssetFormat.md §2.7), used here because Player
; has grown enough poses/clips to be worth grouping by pose instead of a single flat folder.
; "walk" matches walk_idle/walk_left/walk_right, etc. Clips without a matching prefix here
; (e.g. "spark") are read straight from the asset's own root folder.
[ClipFolders]
walk = Walk
crawl = Crawl
jump = Jump
climb = Climb
clamber = Clamber
hang = Hang
swim = Swim

