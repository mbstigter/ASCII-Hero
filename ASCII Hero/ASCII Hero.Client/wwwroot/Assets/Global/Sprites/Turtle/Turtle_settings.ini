[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Turtle

[Animation]
FrameDurationSeconds = 0.5
Mode = Loop

; While it moves, its animation steps to the next frame every 1.0 cells travelled, so it
; keeps pace with the ground at any speed and holds still while it is stopped.
[Animation.move_left]
CellsPerFrame = 1.0

[Animation.move_right]
CellsPerFrame = 1.0

[Poses]
Default = Move
; A friendly turtle that plods back and forth. The idle clip shows while it stands still; the
; left/right clips play while it walks so it faces the way it is heading.
Move = move_idle, move_left, move_right
