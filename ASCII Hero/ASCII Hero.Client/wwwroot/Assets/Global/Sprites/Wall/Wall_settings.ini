[Layout]
EmptyChar = ' '
; Cells drawn with this character show the wall's material, so one drawing serves every material.
MaterialChar = '^'

; One style per clip (ancient, ...), each with a _decayed variant that has ragged edges. Walls are
; 2 cells wide, the same width as a door, so a
; door fits flush under a short wall hanging from a floor piece. They repeat downward in a
; 2-cell unit: set the height with Span.
TileAxis = Vertical

[Physics]
DefaultMaterial = AncientStone

[Colors]
DefaultBackgroundColor = None
