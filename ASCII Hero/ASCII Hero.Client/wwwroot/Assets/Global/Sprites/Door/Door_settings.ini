[Layout]
EmptyChar = ' '
; Cells drawn with this character show the door's material (wood, steel...), so one
; drawing serves every material. Set Material on a placement to pick another one.
MaterialChar = '^'
TileAxis = Vertical

[Physics]
DefaultMaterial = Wood

; Opening swings the door out to the right, growing from 2 to 6 cells wide.
[Animation.open]
FrameDurationSeconds = 0.1
Mode = Once
