[Layout]
; Space is a real (solid) cell in the ancient door, so a different character marks "no cell here".
EmptyChar = '.'
; Cells drawn with this character show the door's material (wood, steel...), so one
; drawing serves every material. Set Material on a placement to pick another one.
MaterialChar = '^'
TileAxis = Vertical

; The ancient door is drawn at its full size, so it is not repeated.
[Layout.ancient_closed]
TileAxis = None

[Layout.ancient_open]
TileAxis = None

[Physics]
DefaultMaterial = Wood

; Opening swings the door out to the right, growing from 2 to 6 cells wide.
[Animation.open]
FrameDurationSeconds = 0.1
Mode = Once

; The ancient door is studded; use it with the ancient stone material.
[Animation.ancient_open]
FrameDurationSeconds = 0.1
Mode = Once
