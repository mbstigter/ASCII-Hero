[Layout]
EmptyChar = '.'

; Horizontal belts repeat sideways, vertical belts repeat downward, in 3-cell units with one arrow
; that steps along the belt. Pick the clip that matches the direction the belt moves, so the
; animation runs the same way.
[Layout.horizontal_right]
TileAxis = Horizontal

[Layout.horizontal_left]
TileAxis = Horizontal

[Layout.vertical_down]
TileAxis = Vertical

[Layout.vertical_up]
TileAxis = Vertical

[Physics]
DefaultMaterial = Conveyor

[Colors]
DefaultBackgroundColor = None

; The arrows step one cell for every cell the belt runs, so they move at exactly the belt's speed.
; The frame time is only used for a belt that has no speed set.
[Animation]
CellsPerFrame = 1
FrameDurationSeconds = 0.25
Mode = Loop