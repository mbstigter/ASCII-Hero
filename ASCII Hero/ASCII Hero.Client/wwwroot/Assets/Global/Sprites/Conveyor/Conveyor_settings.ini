[Layout]
EmptyChar = '.'

; Horizontal belts repeat sideways, vertical belts repeat downward.
; Pick the clip that matches the direction the belt moves, so the animation runs the same way.
[Layout.horizontal_right]
TileAxis = Horizontal

[Layout.horizontal_left]
TileAxis = Horizontal

[Layout.vertical_down]
TileAxis = Vertical

[Layout.vertical_up]
TileAxis = Vertical

[Physics]
DefaultMaterial = Conveyor

[Animation]
FrameDurationSeconds = 0.25
Mode = Loop