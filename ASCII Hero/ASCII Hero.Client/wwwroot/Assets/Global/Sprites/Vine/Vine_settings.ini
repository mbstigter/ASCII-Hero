[Layout]
EmptyChar = ' '

; A hanging vine, a leafy alternative to a vertical rope. It only hangs downward and does not move.
; It repeats downward in 2-cell units, so set its length with Span (an even number ends cleanly).
; Like a rope, make it climbable in the level to let the hero climb it.
[Layout.vertical]
TileAxis = Vertical

[Physics]
DefaultMaterial = Plant
