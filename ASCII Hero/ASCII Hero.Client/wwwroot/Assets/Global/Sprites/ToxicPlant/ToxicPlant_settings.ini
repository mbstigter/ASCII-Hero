[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Plant

[Animation]
FrameDurationSeconds = 0.5
Mode = PingPong
DefaultFrame = 1

; Played as a cosmetic effect (see IEffectTrigger/EffectClipName) when this instance is killed
; (IKillableBody, landed on from above) - shrinks down to a residue on the bottom row only over
; 3 steps, then (paired with EffectPersists = true) holds there forever as a permanent husk. Mode
; = Once (not Loop/PingPong) is required for that: it plays through the frames once and then
; clamps on the last one instead of wrapping/bouncing back to the full-plant look.
[Animation.crumble]
FrameDurationSeconds = 0.2
Mode = Once
DefaultFrame = 0
