[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Insect

[Animation]
FrameDurationSeconds = 0.12
Mode = Loop

; While it stands still, the ant slowly looks left and right.
[Animation.move_idle]
FrameDurationSeconds = 1.0
Mode = Loop

; While it moves, its animation steps to the next frame every 0.4 cells travelled, so it
; keeps pace with the ground at any speed and holds still while it is stopped.
[Animation.move_left]
CellsPerFrame = 0.4

[Animation.move_right]
CellsPerFrame = 0.4

[Poses]
Default = Move
; A tiny black ant. It faces the way it is walking and its legs shuffle as it goes.
Move = move_idle, move_left, move_right
