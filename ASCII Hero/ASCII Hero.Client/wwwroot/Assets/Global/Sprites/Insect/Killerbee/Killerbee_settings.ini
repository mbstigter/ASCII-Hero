[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Insect

[Animation]
FrameDurationSeconds = 0.1
Mode = Loop

; Played on the bee when something hurts it without finishing it off (e.g. a thrown rock).
; The bee glows red/orange for a moment, during which it can't be hurt again. Nothing is
; drawn for it, so it needs no drawing files.
[Animation.hurt]
EffectDurationSeconds = 0.6
TintColor = L
TintAlternateColor = M
TintBlinkSeconds = 0.1

[Poses]
Default = Move
Move = move_idle, move_left, move_right
