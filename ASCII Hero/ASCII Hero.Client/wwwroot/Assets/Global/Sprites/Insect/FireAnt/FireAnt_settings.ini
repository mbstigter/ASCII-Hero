[Layout]
EmptyChar = ' '

[Physics]
DefaultMaterial = Insect

[Animation]
FrameDurationSeconds = 0.12
Mode = Loop

; While it stands still, the ant slowly looks left and right.
[Animation.move_idle]
FrameDurationSeconds = 1.0
Mode = Loop

; While it moves, its animation steps to the next frame every 0.4 cells travelled, so it
; keeps pace with the ground at any speed and holds still while it is stopped.
[Animation.move_left]
CellsPerFrame = 0.4

[Animation.move_right]
CellsPerFrame = 0.4

; Played on the ant when something hurts it without finishing it off (e.g. a thrown rock).
; The ant glows red/orange for a moment, during which it can't be hurt again. Nothing is
; drawn for it, so it needs no drawing files.
[Animation.hurt]
EffectDurationSeconds = 0.6
TintColor = L
TintAlternateColor = M
TintBlinkSeconds = 0.1

; Left behind where the ant is defeated: a small trace in its colors that stays there.
[Animation.died]
FrameDurationSeconds = 0.2
Mode = Once
DefaultFrame = 0

[Poses]
Default = Move
; A tiny red ant. It faces the way it is walking and its legs shuffle as it goes.
Move = move_idle, move_left, move_right
