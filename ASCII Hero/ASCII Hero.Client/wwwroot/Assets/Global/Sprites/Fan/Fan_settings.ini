[Layout]
EmptyChar = ' '
MaterialChar = '#' ; The back of the fan is drawn in its material

; Each fan is one rotor: flat fans are 7 cells wide and 3 high, upright fans 4 wide and 5 high.
; Set Span on a placement to line up several rotors:
; flat fans (blowing up or down) widen, upright fans (blowing left or right) grow taller.
[Layout.horizontal_up_off]
TileAxis = Horizontal

[Layout.horizontal_up_on]
TileAxis = Horizontal

[Layout.horizontal_down_off]
TileAxis = Horizontal

[Layout.horizontal_down_on]
TileAxis = Horizontal

[Layout.vertical_right_off]
TileAxis = Vertical

[Layout.vertical_right_on]
TileAxis = Vertical

[Layout.vertical_left_off]
TileAxis = Vertical

[Layout.vertical_left_on]
TileAxis = Vertical

[Physics]
DefaultMaterial = Concrete

[Colors]
DefaultBackgroundColor = None ; Blades and nose stand free against whatever is behind them; only the back is filled

; Vertical fans stand upright and blow left or right; horizontal fans lie flat and blow up or down.
; While on, the blades turn through edge-on and back like a spinning rotor, lit from one side.
; Every fan turns about once and a quarter per second. That suits moving air with a FlowSpeed of
; about 60, so give the air a fan drives roughly that speed to keep blades and wind in step.
[Animation.vertical_right_on]
FrameDurationSeconds = 0.1 ; 1/10 s, keeps the spin smooth on common screens
Mode = PingPong

[Animation.horizontal_up_on]
FrameDurationSeconds = 0.0667 ; 1/15 s, keeps the spin smooth on common screens
Mode = PingPong

[Animation.vertical_left_on]
FrameDurationSeconds = 0.1 ; 1/10 s, keeps the spin smooth on common screens
Mode = PingPong

[Animation.horizontal_down_on]
FrameDurationSeconds = 0.0667 ; 1/15 s, keeps the spin smooth on common screens
Mode = PingPong
