[Layout]
EmptyChar = ' '
; Cells drawn with this character show the hatch's material (wood, steel...), so one
; drawing serves every material. Set Material on a placement to pick another one.
MaterialChar = '^'
TileAxis = Horizontal

[Physics]
DefaultMaterial = Wood

; Opening swings the hatch down from its top edge, growing from 1 to 3 rows high.
[Animation.open]
FrameDurationSeconds = 0.1
Mode = Once
