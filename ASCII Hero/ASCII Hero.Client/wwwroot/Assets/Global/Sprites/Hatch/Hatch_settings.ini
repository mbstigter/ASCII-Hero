[Layout]
; Space is a real (solid) cell in the ancient hatch, so a different character marks "no cell here".
EmptyChar = '.'
; Cells drawn with this character show the hatch's material (wood, steel...), so one
; drawing serves every material. Set Material on a placement to pick another one.
MaterialChar = '^'
TileAxis = Horizontal

; The ancient hatch is drawn at its full size, so it is not repeated.
[Layout.ancient_closed]
TileAxis = None

[Layout.ancient_open]
TileAxis = None

[Physics]
DefaultMaterial = Wood

; Opening swings the hatch down from its top edge, growing from 1 to 3 rows high.
[Animation.open]
FrameDurationSeconds = 0.1
Mode = Once

; The ancient hatch is 6 cells wide; use it with the ancient stone material.
[Animation.ancient_open]
FrameDurationSeconds = 0.1
Mode = Once
