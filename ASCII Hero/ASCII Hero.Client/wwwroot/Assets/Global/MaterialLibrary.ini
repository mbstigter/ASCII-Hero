; Shared material library. Every DefaultMaterial in a per-asset settings.ini, and every
; Material set on a level placement, references one of these section names.
;
; Density     - relative mass per world-cell "volume"; drives mass and buoyancy.
; Friction    - 0 = frictionless, 1 = very grippy (above 1 = extra grippy).
; Restitution - bounciness; 0 = no bounce, 1 = perfectly elastic. Describes how much energy this
;   material gives back when it is the one that gets squashed on impact.
; Hardness    - how stiff the material is on impact, on a smooth scale: about 0.1 = very soft
;   (foam, mud), 1 = medium (rubber, flesh), 10 = very hard (stone, steel). When two materials
;   collide the softer one gets squashed more, so its Restitution counts more: a rubber ball
;   bounces well on concrete and a little less on wood. Optional, defaults to 1.
; Viscosity   - drag on anything moving through this material as its ambient medium; 0 = no
;   resistance, higher values resist motion more strongly. Optional, defaults to 0.
; ForegroundColor/BackgroundColor - optional color code (see Global/ColorPalette.ini) used as this
;   material's own fallback tier in the render color-resolution chain: per-cell code > object
;   override > sprite default > this material default > level default > hardcoded engine color.
; Character - optional default glyph representing this material, used as the glyph for a
;   materials-only world object (one naming this Material but no Asset); a placement may also
;   override it per-instance via its own Character key.

; --- Things you move through ---
; Fill the space around bodies: their Viscosity drags on anything moving through them.

[Air]
Density = 0.0012
Friction = 0.0
Restitution = 0.0
Hardness = 0.1
Viscosity = 0.02
ForegroundColor = J
Character = ' '

[Water]
Density = 1.0
Friction = 0.05
Restitution = 0.0
Hardness = 0.1
Viscosity = 0.15
ForegroundColor = I
BackgroundColor = H
Character = ~

