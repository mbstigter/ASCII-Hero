; --- Objects ---
; Materials for specific objects, always drawn by their own sprite.

; Wooden crate packed with cargo: the wood's grip and bounce, but much heavier than solid wood
; because of what's inside. Sinks in water. Heavier crates can be made per placement.
[Crate]
Density = 2.5 ; about 3.5 times the player's weight - shoved around easily, budges a little when walked on
Friction = 0.5
Restitution = 0.3
Hardness = 3
ForegroundColor = B
BackgroundColor = A

; Light, grippy braided fibre with almost no bounce.
[Rope]
Density = 0.5
Friction = 0.8
Restitution = 0.1
Hardness = 0.5
ForegroundColor = A

; Grippy belt surface with almost no bounce, so riders stay on. Conveyor sprites draw their own look.
[Conveyor]
Density = 1.1
Friction = 0.9
Restitution = 0.05
Hardness = 1

[Chainsaw]
Density = 7.8
Friction = 0.3
Restitution = 0.3
Hardness = 10
ForegroundColor = U

; A beam of light: weightless and frictionless, nothing bounces off it.
[Laser]
Density = 0.01
Friction = 0.0
Restitution = 0.0
Hardness = 0.1
ForegroundColor = R

; --- Living things ---
; Each creature has its own material, so it always weighs the same wherever it is placed.
; They share a starting point - Friction = 0.6, Restitution = 0.2, Hardness = 1 - and mostly
; differ in Density. Always drawn by their own sprite, so they need no Character.

; The player.
[Human]
Density = 0.95
Friction = 0.6
Restitution = 0.2
Hardness = 1
ForegroundColor = 6

; Light for its length: a snake weighs about half as much as a human of the same size.
[Snake]
Density = 0.5
Friction = 0.6
Restitution = 0.2
Hardness = 0.8

; Small, very light and not very grippy.
[Bird]
Density = 0.1
Friction = 0.2
Restitution = 0.3
Hardness = 0.5

; About as heavy as water, so it neither sinks nor floats - it hangs wherever it swims.
[Fish]
Density = 1.0
Friction = 0.2
Restitution = 0.2
Hardness = 0.5

; The lightest creature: delicate wings, barely any weight.
[Butterfly]
Density = 0.05
Friction = 0.6
Restitution = 0.2
Hardness = 0.5

; Its hard shell makes it much harder and grippier than other creatures, with almost no bounce.
[Turtle]
Density = 0.8
Friction = 0.8
Restitution = 0.1
Hardness = 4

; Shared by all plants, flowers and grass: light, soft and floppy.
[Plant]
Density = 0.3
Friction = 0.4
Restitution = 0.1
Hardness = 0.3
