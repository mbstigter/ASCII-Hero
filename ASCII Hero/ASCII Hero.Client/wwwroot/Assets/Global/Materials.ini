; Shared material library. Every _material.txt cell value, and every DefaultMaterial
; in a per-asset settings.ini, references one of these section names.
;
; Density     - relative mass per world-cell "volume"; drives mass and buoyancy.
; Friction    - 0 = frictionless, 1 = very grippy.
; Restitution - bounciness; 0 = no bounce, 1 = perfectly elastic.
; ForegroundColor/BackgroundColor - optional color code (see Global/Colors.ini) used as this
;   material's own fallback tier in the render color-resolution chain: per-cell code > object
;   override > sprite default > this material default > level default > hardcoded engine color.
; DefaultChar - optional default glyph representing this material. Reserved for future use; not
;   yet read by any loader/renderer.

[Flesh]
Density = 1.05
Friction = 0.6
Restitution = 0.2
ForegroundColor = 6
DefaultChar = ▓

