; Shared material library. Every _material.txt cell value, and every DefaultMaterial
; in a per-asset settings.ini, references one of these section names.
;
; Density     - relative mass per world-cell "volume"; drives mass and buoyancy.
; Friction    - 0 = frictionless, 1 = very grippy.
; Restitution - bounciness; 0 = no bounce, 1 = perfectly elastic.

[Flesh]
Density = 1.05
Friction = 0.6
Restitution = 0.2

[Rubber]
Density = 1.1
Friction = 0.9
Restitution = 0.85

[Glass]
Density = 2.5
Friction = 0.4
Restitution = 0.1

[Steel]
Density = 7.8
Friction = 0.3
Restitution = 0.3

[Brick]
Density = 1.8
Friction = 0.7
Restitution = 0.05

[Stone]
Density = 2.7
Friction = 0.8
Restitution = 0.05

[Wood]
Density = 0.7
Friction = 0.5
Restitution = 0.15

[Plant]
Density = 0.3
Friction = 0.4
Restitution = 0.1

[Air]
Density = 0.0012
Friction = 0.0
Restitution = 0.0

[Water]
Density = 1.0
Friction = 0.05
Restitution = 0.0
