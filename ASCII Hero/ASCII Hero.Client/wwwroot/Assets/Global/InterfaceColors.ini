; Interface colors: menus, HUD, overlays and message boxes.
; World and sprite colors live in ColorPalette.ini instead.
; Every entry is required. Values are CSS hex colors.
; Each color has a dark, normal and light tint. The message boxes draw their
; shrinking ripple with the light tint in front and the dark tint trailing,
; then the box keeps glowing through dark, normal and light while the message
; text stays in the normal tint.

[Colors]
Black = #000000      ; Message box text background

GreenDark = #008f00  ; Menu control keys, HUD numbers, bottom of the menu logo and arrows, freshly moved selection box
Green = #00ff00      ; Standard interface green (HUD, menu, Level Complete box)
GreenLight = #9dff9d ; Top of the menu logo and arrows

AmberDark = #8a5f00
Amber = #ffb000      ; Exit confirmation box
AmberLight = #ffd27a

RedDark = #8f0000
Red = #ff0000        ; Game Over box
RedLight = #ff8080

BlueDark = #00458f   ; Blue is not used yet
Blue = #2f9bff
BlueLight = #a0d2ff
