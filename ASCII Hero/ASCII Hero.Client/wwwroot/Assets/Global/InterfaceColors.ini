; Interface colors: menus, HUD, overlays and message boxes.
; World and sprite colors live in ColorPalette.ini instead.
; Values are CSS hex colors. Each color has a Dark, Normal and Light tint. The
; message boxes draw their shrinking ripple with the Light tint in front and the
; Dark tint trailing, then the box keeps glowing through Dark, Normal and Light
; while the message text stays in the Normal tint.
; Anything missing from this file shows as green on black.

[Defaults]
; The color of the whole interface: menu, logo, arrows, control keys, HUD and
; loading bar, in all three tints. Name one of the color sections below.
; Also the color of any world character that has no color of its own.
Foreground = Green
; Shown wherever nothing else is drawn, unless a world has its own backdrop.
Background = #000000

[Green]
GreenDark = #008f00
GreenNormal = #00ff00
GreenLight = #9dff9d
; Always used for the Level Complete box.

[Amber]
AmberDark = #8a5f00
AmberNormal = #ffb000
AmberLight = #ffd27a
; Always used for the exit confirmation box.

[Red]
RedDark = #8f0000
RedNormal = #ff0000
RedLight = #ff8080
; Always used for the Game Over box.

[Blue]
BlueDark = #00458f
BlueNormal = #2f9bff
BlueLight = #a0d2ff

[White]
WhiteDark = #808080
WhiteNormal = #c0c0c0
WhiteLight = #ffffff
