; Shared sound library. Every sound is synthesized (no audio files needed) and referenced by its
; section name, e.g. from a Sound/KillSound key in a world's objects.ini or from a sprite's [Sounds]
; section. A sound that is not named anywhere is simply never heard, and a name that isn't defined
; here is silent - so a level can be made completely silent by not naming any sounds.
;
; Wave      - tone shape: Square, Triangle, Sawtooth, Sine or Noise. Square is the classic
;   retro "beep"; Noise gives a soft rustle/whoosh instead of a pitched tone.
; StartFreq - pitch in Hz at the start of the sound (for Noise: the tone of the rustle).
; EndFreq   - pitch in Hz at the end; the pitch slides from StartFreq to EndFreq. Optional,
;   defaults to StartFreq (a steady tone).
; Duration  - length of the sound in seconds.
; Volume    - loudness from 0 (silent) to 1 (full). Keep frequently repeated sounds such as
;   footsteps very low so they stay subtle.
; Attack    - fade-in time in seconds. Optional, defaults to a very short fade-in.
; Vibrato   - optional wobble in Hz, for a more "warbly" arcade feel. Optional, defaults to none.
;
; A world can add or change sounds with its own SoundLibrary.ini; same-named sections there
; replace the ones defined here.

