; Shared color palette. Every _fore.txt / _back.txt cell value is a single-character
; code looked up here. Codes are case-sensitive; keep this file small and memorable
; rather than trying to cover every possible color up front - add more as needed.

[Colors]
K = #000000  ; blacK
W = #FFFFFF  ; White
R = #B22222  ; Red (firebrick)
G = #3CB043  ; Green
B = #4A6FA5  ; Blue
Y = #E8D44D  ; Yellow
O = #D2691E  ; Orange / brown (also used for wood, bark)
N = #8B5A2B  ; browN (darker wood/soil tone)
S = #9C9C9C  ; Steel gray
D = #5A5A5A  ; Dark gray (mortar/shadow)
C = #708090  ; Concrete/stone gray-blue
P = #6B8E23  ; Plant green (olive-ish, for foliage)
T = #2E8B57  ; Toxic green (sea green, for the toxic plant)
F = #D8B58A  ; Flesh/skin tone
H = #7A5230  ; Hair/brown
