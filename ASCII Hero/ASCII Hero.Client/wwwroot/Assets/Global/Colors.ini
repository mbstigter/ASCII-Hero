; Shared color palette. Every _fore.txt / _back.txt cell value is a single-character
; code looked up here. Codes are `0`-`9` plus `A`-`V` (32 possible codes, see
; docs/Design.md) - allocated mnemonically as needed, not sequentially. Lowercase
; letters are not part of this convention; ColorPalette's lookup is technically
; case-sensitive, but stick to `0`-`9`/`A`-`V` for every new code.

[Colors]
K = #000000  ; blacK
W = #FFFFFF  ; White
R = #B22222  ; Red (firebrick)
G = #3CB043  ; Green
B = #4A6FA5  ; Blue
Y = #E8D44D  ; Yellow
O = #D2691E  ; Orange / brown (also used for wood, bark)
N = #8B5A2B  ; browN (darker wood/soil tone)
S = #9C9C9C  ; Steel gray
D = #5A5A5A  ; Dark gray (mortar/shadow)
C = #708090  ; Concrete/stone gray-blue
P = #6B8E23  ; Plant green (olive-ish, for foliage)
T = #2E8B57  ; Toxic green (sea green, for the toxic plant)
F = #D8B58A  ; Flesh/skin tone
H = #7A5230  ; Hair/brown
1 = #A69433  ; dim Yellow (mid-fade step for a fading pickup effect)
2 = #6B5D22  ; dimmest Yellow (final fade step for a fading pickup effect)
