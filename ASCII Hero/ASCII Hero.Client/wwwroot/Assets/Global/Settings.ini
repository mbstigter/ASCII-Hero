; Game-wide default settings. Any per-asset settings.ini can override these.

[Layout]
; Default "no cell here" marker for every grid layer file (chars/fore/back/material)
; unless a specific asset's own settings.ini overrides it under [Layout].
EmptyChar = ' '

[Physics]
; Default gravity acceleration, in world cells per second squared, for any world
; that does not specify its own value.
Gravity = 40

[Render]
; Font family used to render the ASCII grid. Must already be available to the
; browser (e.g. via an @font-face declaration, or a system font) - naming a font
; here does not itself load any new font asset.
FontFamily = "Web437IbmVga8x14", monospace

; Width/height of the viewport, in whole character columns/rows. The canvas's
; actual pixel size is always this many columns/rows times the active cell size,
; so it adapts automatically to whatever font size is configured below.
ViewportColumns = 80
ViewportRows = 25

; Mandatory: the final on-screen cell size (width x height, in pixels) used to
; render one character. A browser's text-measuring API can't reliably report a
; true bitmap font's native pixel size (like the one bundled by default), so
; this must be set explicitly - normally an integer multiple of the font's own
; documented native size (e.g. the bundled font is natively 8x14, so 16/28 here
; gives a 2x zoomed-in look). A deliberately non-uniform pair (e.g. 15/28) can
; squeeze/stretch the font in one direction if ever desired.
FontWidthPixels = 16
FontHeightPixels = 28
