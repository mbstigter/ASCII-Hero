; Game-wide default settings. Any per-asset settings.ini can override these.

[Layout]
; Default "no cell here" marker for every grid layer file (chars/fore/back/material)
; unless a specific asset's own settings.ini overrides it under [Layout].
EmptyChar = ' '

[Physics]
; Default gravity acceleration, in world cells per second squared, for any world
; that does not specify its own value.
Gravity = 40

[Render]
; Font family used to render the ASCII grid. Must already be available to the
; browser (e.g. via an @font-face declaration, or a system font) - naming a font
; here does not itself load any new font asset.
FontFamily = "WebPlusIbmVga8x16", monospace

; Width/height of the viewport, in whole character columns/rows. The canvas's
; actual pixel size is always this many columns/rows times the active cell size,
; so it adapts automatically to whatever font size is configured below.
ViewportColumns = 80
ViewportRows = 25

; Mandatory: the final on-screen cell size (width x height, in pixels) used to
; render one character. A browser's text-measuring API can't reliably report a
; true bitmap font's native pixel size (like the one bundled by default), so
; this must be set explicitly - normally an integer multiple of the font's own
; documented native size (e.g. the bundled font is natively 8x16, so 16/32 here
; gives a 2x zoomed-in look). A deliberately non-uniform pair (e.g. 15/32) can
; squeeze/stretch the font in one direction if ever desired.
FontWidthPixels = 16
FontHeightPixels = 32

[Sound]
; Turns all game sound on (true) or off (false).
Enabled = true

; Overall volume, from 0 (silent) to 1 (full).
MasterVolume = 1

[Gear]
; The kinds of gear the player can carry, one per line: Name = the icon shown for it.
; A throwable object in a world names the gear it belongs to with its 'Gear' key; the player
; can only pick it up when that gear is listed here. Keys are carried as the 'Key' gear, so
; keys can only be picked up while Key is listed. The selected gear is shown in the gear box
; next to the HUD; the action key throws it or, with Key selected, unlocks a gate. Hold Tab
; to open the gear ring, pick another gear with Left/Right and release Tab to take it.
; The ring shows the gear in the order listed here; the first one is selected at the start.
; Comment a line out to switch that gear off in every world.
Key = ♀
Rock = ●

; Extra gear to choose from in the gear ring. No object in any world belongs to these.
Tomato = ♥
Egg = ○
Snowball = ☼
Apple = ♣
