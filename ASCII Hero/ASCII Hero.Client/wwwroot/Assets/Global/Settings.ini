; Game-wide default settings. Any per-asset settings.ini can override these.

[Layout]
; Default "no cell here" marker for every grid layer file (chars/fore/back/material)
; unless a specific asset's own settings.ini overrides it under [Layout].
EmptyChar = ' '

[Physics]
; Default gravity acceleration, in world cells per second squared, for any world
; that does not specify its own value.
Gravity = 40
