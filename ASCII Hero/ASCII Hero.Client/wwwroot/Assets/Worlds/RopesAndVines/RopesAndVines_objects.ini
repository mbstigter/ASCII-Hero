; --- Pickups ---

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
CollectSound = DiamondPickup

; A first-aid bag to carry for later; use it once to restore health fully.
[HealthPack]
; --- Identity ---
Asset = HealthPack
Clip = default
Kind = Collectable
; --- Pickup ---
Type = HealthPack
CollectSound = HealthPickup
UseSound = HealthUse

; Touching this finishes the world.
[WorldEnd]
; --- Identity ---
Asset = WorldEnd
Clip = default
Kind = Collectable
; --- Pickup ---
Type = WorldEnd
EffectClip = reached
EffectPersists = true ; Stays in place once reached
CollectSound = WorldEnd

; Locked door just before the world end. With the gold key selected, the action key
; (E or Enter) next to it opens or closes the door. The key is kept.
[ExitDoor]
; --- Identity ---
Asset = Door
Clip = default
Span = 8 ; Length in cells
Kind = Gate
; --- Lock ---
Lock = Exit
OperateSound = DoorMove

; Gold key on the top platform. Opens the door to the world end.
[ExitKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = Y
; --- Pickup ---
Type = Key
Lock = Exit ; Opens the door to the world end
CollectSound = KeyPickup
UseSound = KeyTurn

; --- Ants ---

; Small black ant that wanders back and forth along the ground, slowly and without any harm.
; It can be squashed from above or hit with a thrown stone, and leaves a small trace when defeated.
; Place it on the ground, or on a platform it can walk along.
[BlackAnt]
; --- Identity ---
Asset = Insect/BlackAnt
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Damage = 0 ; Harmless: touching it takes nothing from the player
Killable = true ; Player can squash it from above
KillSound = HazardKill ; Played when the player kills it from above
Health = 1.5 ; Takes two stomps, or three thrown rocks (default 1)
HurtEffectClip = hurt ; Played on it when it is hurt but survives. Empty = no effect
HurtSound = HazardHurt ; Played when it is hurt but survives
EffectClip = died ; Played where it is defeated, leaving its body behind
EffectPersists = true ; The body stays in the world
; --- Patrol ---
Patrol = true ; Walks back and forth
PatrolStayOnPlatform = true ; Turns around at the platform edges instead of walking off
PatrolCruiseSpeedX = 3 ; Walking speed in cells per second
PatrolForceMultiplierX = 17 ; How quickly it reaches that speed

; Small fiery ant that walks back and forth along its platform. It is tough: it takes two squashes from
; above (or three thrown stones) to defeat.
[FireAnt]
; --- Identity ---
Asset = Insect/FireAnt
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Damage = 0.1 ; Share of a full health bar removed per hit
Killable = true ; Player can squash it from above
KillSound = HazardKill ; Played when the player kills it from above
Health = 1.5 ; Takes two stomps, or three thrown rocks (default 1)
HurtEffectClip = hurt ; Played on it when it is hurt but survives. Empty = no effect
HurtSound = HazardHurt ; Played when it is hurt but survives
EffectClip = died ; Played where it is defeated, leaving its body behind
EffectPersists = true ; The body stays in the world
; --- Patrol ---
Patrol = true ; Walks back and forth
PatrolStayOnPlatform = true ; Turns around at the platform edges instead of walking off
PatrolCruiseSpeedX = 4 ; Walking speed in cells per second
PatrolForceMultiplierX = 17 ; How quickly it reaches that speed
