; A playground for ropes: ropes you climb, ropes you hang from, and ropes that keep pulling you
; along.

[ObjectCodes]
0 = Player
G = Ground
D = Diamond
L = WorldEnd
A = Ledge
W = Wall
S = RopeAnchorVertical
H = RopeAnchorHorizontal
1 = RopeVertical
2 = RopeHorizontal
3 = RopeVerticalUp
4 = RopeHorizontalLeft
5 = RopeHorizontalRight
6 = RopeVerticalDown
7 = Vine
R = GrassFloor
V = WallPlantLeftOfWall
Y = WallPlantRightOfWall
K = GrassHangingLedge
B = ExitDoor
E = ExitKey
N = BlackAnt
M = FireAnt
X = HealthPack

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtSound = PlayerHurt
KillSound = PlayerKill
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
CheckpointReachedEffectClip = ; Played on the player when reaching a checkpoint. Empty = no effect
WorldEndReachedEffectClip = worldendreached ; Played on the player when reaching the world end. Empty = no effect
HealedEffectClip = healed ; Played on the player when a health pack restores health. Empty = no effect

; Floor running the full width of the world.
[Ground]
; --- Identity ---
Material = AncientStone
Width = 100
Height = 1
Kind = StaticObject

; Green grass growing along the whole floor. Purely decorative: the player walks straight through it.
[GrassFloor]
; --- Identity ---
Asset = Grass
Clip = floor_green
Kind = StaticObject
Span = 100 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through

; Toxic plant (red and orange tips) growing out of the left face of the tall wall. Mildly toxic: brushing against it hurts a little, but the player can still pass through it.
[WallPlantLeftOfWall]
; --- Identity ---
Asset = WallPlant
Clip = rightwall_toxic
Kind = StaticHazard
; --- Combat ---
Damage = 0.1 ; Share of a full health bar removed per hit (default 1 = a whole bar)

; Green plant growing out of the right face of the tall wall. Purely decorative: the player walks straight through it.
[WallPlantRightOfWall]
; --- Identity ---
Asset = WallPlant
Clip = leftwall_brown
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Short tuft of dry, brown grass hanging under a ledge. Place it directly below the ledge. Purely decorative: the player walks straight through it.
[GrassHangingLedge]
; --- Identity ---
Asset = Grass
Clip = hanging_brown
Kind = StaticObject
Span = 8 ; Length in cells (width), matching the ledge
; --- Behavior ---
Passable = true ; Can be walked through

; Short stone ledge.
[Ledge]
; --- Identity ---
Material = AncientStone
Width = 8
Height = 1
Kind = StaticObject

; Tall stone wall, 1 wide and 28 high. Blocks the way; the grid marker is its top cell.
[Wall]
; --- Identity ---
Material = AncientStone
Width = 1
Height = 28
Kind = StaticObject

; Single stone that a hanging rope is tied to. Place it directly above the top of a
; vertical rope. Purely decorative: the player passes straight through it.
[RopeAnchorVertical]
; --- Identity ---
Material = AncientStone
Character = Ω
Width = 1
Height = 1
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Single stone that a stretched rope is tied to.
; directly right of a horizontal rope. Purely decorative: the player passes straight through it.
[RopeAnchorHorizontal]
; --- Identity ---
Material = AncientStone
Character = §
Width = 1
Height = 1
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; --- Ropes ---

; Hanging rope, 8 cells tall. Climb it.
[RopeVertical]
; --- Identity ---
Asset = Rope
Clip = vertical
Kind = StaticObject
Span = 8 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
ClimbStyle = Shimmy ; Hero climbs it like a pole instead of a ladder

; Hanging vine, 23 cells tall. A leafy alternative to the hanging rope: climb it the same way.
[Vine]
; --- Identity ---
Asset = Vine
Clip = vertical
Kind = StaticObject
Span = 23 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
ClimbStyle = Shimmy ; Hero climbs it like a pole instead of a ladder

; Stretched rope, 12 cells wide. Hang from it and move along.
[RopeHorizontal]
; --- Identity ---
Asset = Rope
Clip = horizontal
Kind = StaticObject
Span = 12 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from

; Hanging rope that keeps pulling upward, 9 cells tall.
[RopeVerticalUp]
; --- Identity ---
Asset = Rope
Clip = vertical_up
Kind = StaticObject
Span = 9 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
ClimbStyle = Shimmy ; Hero climbs it like a pole instead of a ladder
; --- Conveyor ---
ConveyorDirection = Up ; Which way the rope moves: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

