
[ObjectCodes]
0 = Player
1 = WallHorizontal
2 = WallVertical
3 = BouncingBallMedium
4 = BouncingBallLarge
5 = RockMedium
6 = RockLarge

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
CheckpointReachedEffectClip = ; Played on the player when reaching a checkpoint. Empty = no effect
LevelEndReachedEffectClip = ; Played on the player when reaching the level end. Empty = no effect
HealedEffectClip = ; Played on the player when a health pack restores health. Empty = no effect
MotorForceMultiplier = ; How quickly the player speeds up and slows down in any movement (default 22)
WalkSpeed = ; Walking speed in cells per second (default 12)
CrawlSpeed = ; Crawling speed in cells per second (default 6)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Walls enclosing the test box. They give back all of a bounce's energy, so the bouncing balls
; never slow down; their grip comes from their material, so the player walks on them normally.
[WallHorizontal]
; --- Identity ---
Material = Stone
Width = 120
Height = 2
Kind = StaticObject
; --- Material (default = from the resolved Material) ---
Restitution = 1.0

[WallVertical]
; --- Identity ---
Material = Stone
Width = 2
Height = 21
Kind = StaticObject
; --- Material (default = from the resolved Material) ---
Restitution = 1.0

; Weightless and perfectly elastic, so they bounce around forever inside the enclosed box
; instead of settling under gravity.
[BouncingBallMedium]
; --- Identity ---
Asset = Ball
Clip = medium
Kind = DynamicObject
; --- Motion ---
GravityAffected = false
InitialVelocityX = 20
InitialVelocityY = 20
; --- Material (default = from the resolved Material) ---
Friction = 0.0
Restitution = 1.0

; Same as above, but bigger and orange plastic, heading off the other way.
[BouncingBallLarge]
; --- Identity ---
Asset = Ball
Clip = large
Material = Plastic
Kind = DynamicObject
; --- Motion ---
GravityAffected = false
InitialVelocityX = -20
InitialVelocityY = 20
; --- Material (default = from the resolved Material) ---
Friction = 0.0
Restitution = 1.0

; Loose rocks in two sizes. They fall, tumble and can be pushed around, each with the weight,
; grip and bounce of ordinary stone - bigger rocks are heavier and harder to shift.
[RockMedium]
; --- Identity ---
Asset = Rock
Clip = medium
Kind = DynamicObject
; --- Motion ---
GravityAffected = true

[RockLarge]
; --- Identity ---
Asset = Rock
Clip = large
Kind = DynamicObject
; --- Motion ---
GravityAffected = true
