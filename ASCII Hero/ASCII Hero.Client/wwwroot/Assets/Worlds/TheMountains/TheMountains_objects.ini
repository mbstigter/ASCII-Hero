[ObjectCodes]
0 = Player
1 = BrickWallTall
2 = BrickWallShort
3 = BrickPlatformLong
4 = BrickPlatformShort
5 = SteelPlatformLong
6 = SteelPlatformShort
7 = ConcretePlatformLong
8 = ConcretePlatformShort
T = ToxicPlant
F = Flower
S = Diamond
R = Ring
P = Pipe
L = Ladder
V = Vine
C = Checkpoint
E = WorldEnd
X = HealthPack

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtSound = PlayerHurt
KillSound = PlayerKill
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
CheckpointReachedEffectClip = checkpointreached ; Played on the player when reaching a checkpoint. Empty = no effect
WorldEndReachedEffectClip = worldendreached ; Played on the player when reaching the world end. Empty = no effect
HealedEffectClip = healed ; Played on the player when a health pack restores health. Empty = no effect
MotorForceMultiplier = ; How quickly the player speeds up and slows down in any movement (default 22)
WalkSpeed = ; Walking speed in cells per second (default 12)
CrawlSpeed = ; Crawling speed in cells per second (default 6)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[BrickWallTall]
; --- Identity ---
Material = Brick
Width = 1
Height = 6
Kind = StaticObject

[BrickWallShort]
; --- Identity ---
Material = Brick
Width = 1
Height = 3
Kind = StaticObject

[BrickPlatformLong]
; --- Identity ---
Material = Brick
Width = 12
Height = 1
Kind = StaticObject

[BrickPlatformShort]
; --- Identity ---
Material = Brick
Width = 6
Height = 1
Kind = StaticObject

[SteelPlatformLong]
; --- Identity ---
Material = Steel
Width = 12
Height = 1
Kind = StaticObject

[SteelPlatformShort]
; --- Identity ---
Material = Steel
Width = 4
Height = 1
Kind = StaticObject

[ConcretePlatformLong]
; --- Identity ---
Material = Concrete
Width = 12
Height = 1
Kind = StaticObject

[ConcretePlatformShort]
; --- Identity ---
Material = Concrete
Width = 6
Height = 1
Kind = StaticObject

[Pipe]
; --- Identity ---
Asset = Pipe
Clip = horizontal
Kind = StaticObject
Span = 12 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from

[Ladder]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = StaticObject
Span = 9 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Hanging vine, 14 cells tall. Climb it like a ladder or rope.
[Vine]
; --- Identity ---
Asset = Vine
Clip = vertical
Kind = StaticObject
Span = 14 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
ClimbStyle = Shimmy ; Hero climbs it like a pole instead of a ladder

; Hazard that can be squashed by landing on top of it. The squashed husk stays in the world.
[ToxicPlant]
; --- Identity ---
Asset = Plant
Clip = medium
Kind = StaticHazard
; --- Combat ---
Damage = 0.2 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Killable = true ; Player can squash it from above
KillSound = HazardKill ; Played when the player kills it from above
Health = ; Dies from one stomp, or two thrown rocks (default 1)
EffectClip = crumble ; Played when squashed
EffectPersists = true ; The squashed husk stays in the world

; Flower with pink petals that flicker gently, 3 tall. Place it directly on top of a floor or ledge. Purely decorative: harmless, and the player walks straight through it.
[Flower]
; --- Identity ---
Asset = Flower
Clip = medium
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
CollectSound = DiamondPickup

; A first-aid bag to carry for later; use it once to restore health fully.
[HealthPack]
; --- Identity ---
Asset = HealthPack
Clip = default
Kind = Collectable
; --- Pickup ---
Type = HealthPack
CollectSound = HealthPickup
UseSound = HealthUse

[Ring]
; --- Identity ---
Asset = Ring
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Ring
EffectClip = fade
CollectSound = RingPickup

[Checkpoint]
; --- Identity ---
Asset = Checkpoint
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Checkpoint
EffectClip = reached
EffectPersists = true ; Stays in place once reached
CollectSound = Checkpoint

; Touching this finishes the world. For now it looks the same as the checkpoint, and stays in
; place once reached.
[WorldEnd]
; --- Identity ---
Asset = WorldEnd
Clip = default
Kind = Collectable
; --- Pickup ---
Type = WorldEnd
EffectClip = reached
EffectPersists = true ; Stays in place once reached
CollectSound = WorldEnd
