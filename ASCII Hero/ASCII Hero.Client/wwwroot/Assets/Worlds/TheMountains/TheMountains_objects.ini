[ObjectCodes]
0 = Player
1 = BrickWallTall
2 = BrickWallShort
3 = BrickPlatformLong
4 = BrickPlatformShort
5 = SteelPlatformLong
6 = SteelPlatformShort
7 = ConcretePlatformLong
8 = ConcretePlatformShort
T = ToxicPlant
R = Ring
P = Pipe
L = Ladder

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
; Plays the Player asset's "spark" clip as a cosmetic effect overlaying the player on an
; ordinary (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side or below.
EffectClip = spark
WalkForceMultiplier = 40 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[BrickWallTall]
Material = Brick
Width = 1
Height = 6
Kind = StaticObject

[BrickWallShort]
Material = Brick
Width = 1
Height = 3
Kind = StaticObject

[BrickPlatformLong]
Material = Brick
Width = 12
Height = 1
Kind = StaticObject

[BrickPlatformShort]
Material = Brick
Width = 6
Height = 1
Kind = StaticObject

[SteelPlatformLong]
Material = Steel
Width = 12
Height = 1
Kind = StaticObject

[SteelPlatformShort]
Material = Steel
Width = 4
Height = 1
Kind = StaticObject

[ConcretePlatformLong]
Material = Concrete
Width = 12
Height = 1
Kind = StaticObject

[ConcretePlatformShort]
Material = Concrete
Width = 6
Height = 1
Kind = StaticObject

[BouncingBall]
Asset = Ball
Clip = default
Kind = DynamicObject
GravityAffected = false
Restitution = 1.0
InitialVelocityX = 14
InitialVelocityY = 10

[ToxicPlant]
Asset = ToxicPlant
Clip = idle
Kind = StaticEnemy
Killable = true
EffectClip = crumble
EffectPersists = true

[Ring]
; A simple pickup: walk the player into it and it disappears.
Asset = Ring
Clip = default
Kind = Collectable
; Plays the Ring asset's "fade" clip (same shape, dimming color) at the ring's position when
; picked up - see EffectInstance2D/IEffectTrigger.
EffectClip = fade

[Pipe]
Asset = Pipe
Clip = default
Kind = StaticObject
Repeat = 12
Passable = true
Hangable = true

[Ladder]
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 9
Passable = true
Climbable = true
