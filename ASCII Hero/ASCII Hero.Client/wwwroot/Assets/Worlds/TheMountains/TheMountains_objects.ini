[Player]
Asset = Player
Clip = walk_idle
Kind = Player
; Plays the Player asset's "spark" clip as a cosmetic effect overlaying the player on an
; ordinary (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side or below.
EffectClip = spark

