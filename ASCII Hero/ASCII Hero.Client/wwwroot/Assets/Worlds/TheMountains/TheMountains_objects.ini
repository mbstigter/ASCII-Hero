[ObjectCodes]
0 = Player
1 = BrickWallTall
2 = BrickWallShort
3 = BrickPlatformLong
4 = BrickPlatformShort
5 = SteelPlatformLong
6 = SteelPlatformShort
7 = ConcretePlatformLong
8 = ConcretePlatformShort
B = BouncingBall
T = ToxicPlant
R = Ring

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
; Plays the Player asset's "spark" clip as a cosmetic effect overlaying the player on an
; ordinary (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side or below.
EffectClip = spark
WalkForceMultiplier = 40 ; Default = PhysicsSystem.DefaultWalkForceMultiplier
WalkSpeed = 12 ; Default = PhysicsSystem.DefaultWalkSpeed
CrawlSpeed = 6 ; Default = PhysicsSystem.DefaultCrawlSpeed
Mass = ; Default = Density * width * height (no override)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[BrickWallTall]
Asset = BrickWall
Clip = default
Kind = StaticObject
Repeat = 6

[BrickWallShort]
Asset = BrickWall
Clip = default
Kind = StaticObject
Repeat = 3

[BrickPlatformLong]
Asset = BrickPlatform
Clip = default
Kind = StaticObject
Repeat = 12

[BrickPlatformShort]
Asset = BrickPlatform
Clip = default
Kind = StaticObject
Repeat = 6

[SteelPlatformLong]
Asset = SteelPlatform
Clip = default
Kind = StaticObject
Repeat = 8

[SteelPlatformShort]
Asset = SteelPlatform
Clip = default
Kind = StaticObject
Repeat = 4

[ConcretePlatformLong]
Asset = ConcretePlatform
Clip = default
Kind = StaticObject
Repeat = 12

[ConcretePlatformShort]
Asset = ConcretePlatform
Clip = default
Kind = StaticObject
Repeat = 6

[BouncingBall]
Asset = Ball
Clip = default
Kind = DynamicObject
GravityAffected = false
Restitution = 1.0
InitialVelocityX = 14
InitialVelocityY = 10

[ToxicPlant]
Asset = ToxicPlant
Clip = idle
Kind = StaticEnemy
Killable = true
EffectClip = crumble
EffectPersists = true

[Ring]
; A simple pickup: walk the player into it and it disappears.
Asset = Ring
Clip = default
Kind = Collectable
; Plays the Ring asset's "fade" clip (same shape, dimming color) at the ring's position when
; picked up - see EffectInstance2D/IEffectTrigger.
EffectClip = fade