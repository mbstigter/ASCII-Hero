[ObjectCodes]
0 = Player
1 = BrickWallTall
2 = BrickWallShort
3 = BrickPlatformLong
4 = BrickPlatformShort
5 = SteelPlatformLong
6 = SteelPlatformShort
7 = ConcretePlatformLong
8 = ConcretePlatformShort
T = ToxicPlant
F = Flower
S = Diamond
R = Ring
P = Pipe
L = Ladder
C = Checkpoint
E = LevelEnd
X = HealthPack

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
CheckpointReachedEffectClip = checkpointreached ; Played on the player when reaching a checkpoint. Empty = no effect
LevelEndReachedEffectClip = levelendreached ; Played on the player when reaching the level end. Empty = no effect
HealedEffectClip = healed ; Played on the player when a health pack restores health. Empty = no effect
MotorForceMultiplier = ; How quickly the player speeds up and slows down in any movement (default 22)
WalkSpeed = ; Walking speed in cells per second (default 12)
CrawlSpeed = ; Crawling speed in cells per second (default 6)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[BrickWallTall]
; --- Identity ---
Material = Brick
Width = 1
Height = 6
Kind = StaticObject

[BrickWallShort]
; --- Identity ---
Material = Brick
Width = 1
Height = 3
Kind = StaticObject

[BrickPlatformLong]
; --- Identity ---
Material = Brick
Width = 12
Height = 1
Kind = StaticObject

[BrickPlatformShort]
; --- Identity ---
Material = Brick
Width = 6
Height = 1
Kind = StaticObject

[SteelPlatformLong]
; --- Identity ---
Material = Steel
Width = 12
Height = 1
Kind = StaticObject

[SteelPlatformShort]
; --- Identity ---
Material = Steel
Width = 4
Height = 1
Kind = StaticObject

[ConcretePlatformLong]
; --- Identity ---
Material = Concrete
Width = 12
Height = 1
Kind = StaticObject

[ConcretePlatformShort]
; --- Identity ---
Material = Concrete
Width = 6
Height = 1
Kind = StaticObject

[Pipe]
; --- Identity ---
Asset = Pipe
Clip = horizontal
Kind = StaticObject
Span = 12 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from

[Ladder]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = StaticObject
Span = 9 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Hazard that can be squashed by landing on top of it. The squashed husk stays in the world.
[ToxicPlant]
; --- Identity ---
Asset = Plant
Clip = medium
Kind = StaticHazard
; --- Combat ---
Damage = 0.2 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it from the side or below
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
EffectClip = crumble ; Played when squashed
EffectPersists = true ; The squashed husk stays in the world

; Flower with pink petals that flicker gently, 3 tall. Place it directly on top of a floor or ledge. Purely decorative: harmless, and the player walks straight through it.
[Flower]
; --- Identity ---
Asset = Flower
Clip = medium
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
Sound = DiamondPickup

; A first-aid bag. Restores the player's health fully; left in place while health is already full.
[HealthPack]
; --- Identity ---
Asset = HealthPack
Clip = default
Kind = Collectable
; --- Pickup ---
Type = HealthPack
Sound = HealthPickup

[Ring]
; --- Identity ---
Asset = Ring
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Ring
EffectClip = fade
Sound = RingPickup

[Checkpoint]
; --- Identity ---
Asset = Checkpoint
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Checkpoint
EffectClip = reached
EffectPersists = true ; Stays in place once reached
Sound = Checkpoint

; Touching this finishes the level. For now it looks the same as the checkpoint, and stays in
; place once reached.
[LevelEnd]
; --- Identity ---
Asset = LevelEnd
Clip = default
Kind = Collectable
; --- Pickup ---
Type = LevelEnd
EffectClip = reached
EffectPersists = true ; Stays in place once reached
Sound = LevelEnd
