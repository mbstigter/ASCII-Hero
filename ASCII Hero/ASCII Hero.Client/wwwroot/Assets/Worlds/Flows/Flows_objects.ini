
[ObjectCodes]
0 = Player
F = Fan
A = WindTunnel
R = RiverSurface
D = River
S = StonePlatform
B = RiverBed
P = UpperPlatform
L = Ladder
K = FanButton

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died
WalkForceMultiplier = 40
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed

; Solid stone ledge at each end of the river to stand on.
[StonePlatform]
Material = Stone
Width = 5
Height = 3
Kind = StaticObject

; Solid floor under the whole river.
[RiverBed]
Material = Stone
Width = 80
Height = 1
Kind = StaticObject

; Long walkway above the river. Walk off either end to drop onto the stone ledges.
[UpperPlatform]
Material = Stone
Width = 70
Height = 2
Kind = StaticObject

[Ladder]
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 9
Passable = true
Climbable = true

; A stationary fan at the left end of the walkway, blowing to the right. It starts off and runs
; (animated) while its button is on.
[Fan]
Asset = Fan
Clip = off
OnClip = on
Kind = Device
Link = Fan

; Button near the right ladder. Press the action key (E or Enter) next to it to switch the fan on
; and off.
[FanButton]
Asset = Button
Clip = off
OnClip = on
Kind = Switch
Latching = false
Link = Fan
Sound = SwitchClick

; Flowing water between the stone ledges: carries anything in it to the right. Made of two
; layers: a one-row surface with gently animated waves, and the body below it drawn empty.
[RiverSurface]
Asset = WaterSurface
Clip = default
Repeat = 35
Kind = FlowZone
Medium = true
FlowDirection = Right
FlowStrength = 12
InitialState = On

[River]
Material = Water
Width = 70
Height = 2
Kind = FlowZone
Medium = true
Character = ' '
FlowDirection = Right
FlowStrength = 12
InitialState = On

; Moving air in front of the fan, like a wind tunnel: blows to the right.
[WindTunnel]
Material = Air
Width = 50
Height = 6
Kind = FlowZone
Medium = true
FlowDirection = Right
FlowStrength = 120
Link = Fan
