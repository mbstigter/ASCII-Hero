
[ObjectCodes]
0 = Player
F = Fan
A = WindTunnel
R = RiverSurface
D = River
S = StonePlatform
B = RiverBed
P = UpperPlatform
L = Ladder
K = FanButton
U = UpdraftFan
W = Updraft
V = UpdraftLever
Y = UpdraftBird

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died
WalkForceMultiplier = 22 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed

; Solid stone ledge at each end of the river to stand on.
[StonePlatform]
; --- Identity ---
Material = Stone
Width = 5
Height = 3
Kind = StaticObject

; Solid floor under the whole river.
[RiverBed]
; --- Identity ---
Material = Stone
Width = 80
Height = 1
Kind = StaticObject

; Long walkway above the river. Walk off either end to drop onto the stone ledges.
[UpperPlatform]
; --- Identity ---
Material = Stone
Width = 70
Height = 2
Kind = StaticObject

[Ladder]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = StaticObject
Span = 9 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Flowing water between the stone ledges: carries anything in it to the right. Made of two
; layers: a one-row surface with gently animated waves, and the body below it drawn empty.
[RiverSurface]
; --- Identity ---
Asset = WaterSurface
Clip = horizontal
Span = 70 ; Length in cells
Kind = FlowZone
; --- Flow ---
Medium = true
FlowDirection = Right
FlowSpeed = 12
InitialState = On

[River]
; --- Identity ---
Material = Water
Width = 70
Height = 2
Kind = FlowZone
Character = ' '
; --- Flow ---
Medium = true
FlowDirection = Right
FlowSpeed = 12
InitialState = On

; Moving air in front of the fan, like a wind tunnel: blows to the right.
[WindTunnel]
; --- Identity ---
Material = Air
Width = 50
Height = 6
Kind = FlowZone
; --- Flow ---
Medium = true
FlowDirection = Right
FlowSpeed = 120
Link = Fan ; Blows while the fan is on

; A stationary fan at the left end of the walkway, blowing to the right. It starts off and runs
; (animated) while its button is on.
[Fan]
; --- Identity ---
Asset = Fan
Clip = vertical_right_off
OnClip = vertical_right_on
Kind = Device
; --- Link ---
Link = Fan

; Button near the right ladder. Press the action key (E or Enter) next to it to switch the fan on
; and off.
[FanButton]
; --- Identity ---
Asset = Button
Clip = off
OnClip = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once pressed; false = every press toggles it
Link = Fan
Sound = SwitchClick

; Fan lying flat on the walkway, blowing straight up. It starts off and runs (animated) while its
; lever is on.
[UpdraftFan]
; --- Identity ---
Asset = Fan
Clip = horizontal_up_off
OnClip = horizontal_up_on
Kind = Device
; --- Link ---
Link = UpdraftFan

; Column of rising air above the upward fan. Place it directly above the fan; set Height so it
; reaches the top of the screen. Width matches the fan.
[Updraft]
; --- Identity ---
Material = Air
Width = 4
Height = 11
Kind = FlowZone
; --- Flow ---
Medium = true
FlowDirection = Up
FlowSpeed = 60
Link = UpdraftFan ; Blows while the fan is on

; Lever next to the upward fan. Press the action key (E or Enter) next to it to switch the fan on
; and off.
[UpdraftLever]
; --- Identity ---
Asset = Lever
Clip = off
OnClip = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once operated; false = every operation toggles it
Link = UpdraftFan
Sound = SwitchClick

; Friendly little bird flying back and forth across the right part of the world, through the
; column of air. Harmless and easy to bump into. It holds the row it is placed on; while the fan
; is on, the rising air pushes it upward and it flies back down to its row afterwards.
[UpdraftBird]
; --- Identity ---
Asset = Bird
Clip = move_idle
Kind = DynamicObject
; --- Patrol ---
Patrol = true ; Patrols back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 58 ; Leftmost column of the route
PatrolMaxX = 77 ; Rightmost column of the route
PatrolInitialDirectionX = Right ; Left or Right (default = toward the farther end of the route)
PatrolCruiseSpeedX = 5 ; Target speed in cells/second (default 6)
PatrolForceMultiplierX = 17 ; How quickly it reaches that speed (default 33)
; --- Patrol (vertical) ---
PatrolCruiseSpeedY = 8 ; Target speed in cells/second when returning to its row (default 6)
PatrolForceMultiplierY = 17 ; How quickly it reaches that speed (default 33)
PatrolMaxForceY = 1.5 ; Wing strength cap in multiples of its own weight (default 0 = no vertical thrust)
