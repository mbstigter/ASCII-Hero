
[ObjectCodes]
0 = Player
1 = BallRubberOnConcrete
2 = BallPlasticOnConcrete
3 = BallRubberOnWood
4 = BallPlasticOnWood
5 = FloorConcrete
6 = FloorWood

[Player]
Asset = Player
Clip = walk_idle
Kind = Player

; Two static floor segments side by side - Concrete on the left half, Wood on the right half -
; each hosting its own pair of ball-drop columns above it (see
; BallRubberOnConcrete/BallPlasticOnConcrete/BallRubberOnWood/BallPlasticOnWood below). Comparing
; the two halves side by side isolates the floor material as the controlled variable: each
; half's own pair of balls (Rubber vs. Plastic) also lets the ball's material be compared while
; the floor underneath it is held constant.

[FloorConcrete]
Asset = ConcretePlatform
Clip = default
Kind = StaticObject
Repeat = 40

[FloorWood]
Asset = WoodPlatform
Clip = default
Kind = StaticObject
Repeat = 40

; All four balls below reuse the one Ball sprite asset, each overriding its material via
; Material as needed. All four are dropped straight down from rest onto their respective floor
; segment, so only each ball/floor material pairing's own combined bounciness/friction drives
; how each one bounces and settles.
; ForegroundColor overrides each placement's color away from the shared Ball asset's own default
; (red), so the four balls stay visually distinguishable by material at a glance despite all
; four reusing the one Ball sprite: brown for Rubber, yellow for Plastic.
[BallRubberOnConcrete]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber
ForegroundColor = N

[BallPlasticOnConcrete]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic
ForegroundColor = Y

[BallRubberOnWood]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber
ForegroundColor = N

[BallPlasticOnWood]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic
ForegroundColor = Y
