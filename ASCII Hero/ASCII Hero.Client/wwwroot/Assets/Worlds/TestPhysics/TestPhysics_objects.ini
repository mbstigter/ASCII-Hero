
[ObjectCodes]
0 = Player
1 = BallRubberOnConcrete
2 = BallPlasticOnConcrete
3 = BallRubberOnWood
4 = BallPlasticOnWood
5 = FloorConcrete
6 = FloorWood

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
CheckpointReachedEffectClip = ; Played on the player when reaching a checkpoint. Empty = no effect
LevelEndReachedEffectClip = ; Played on the player when reaching the level end. Empty = no effect
HealedEffectClip = ; Played on the player when a health pack restores health. Empty = no effect
MotorForceMultiplier = ; How quickly the player speeds up and slows down in any movement (default 22)
WalkSpeed = ; Walking speed in cells per second (default 12)
CrawlSpeed = ; Crawling speed in cells per second (default 6)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Two floor segments side by side: concrete on the left half, wood on the right half. Each has its
; own pair of balls dropped onto it, one rubber and one plastic. Comparing the halves shows the
; effect of the floor material; comparing the balls on one half shows the effect of the ball
; material.
[FloorConcrete]
; --- Identity ---
Material = Concrete
Width = 40
Height = 2
Kind = StaticObject

[FloorWood]
; --- Identity ---
Material = Wood
Width = 40
Height = 2
Kind = StaticObject

; The four balls share one sprite and are dropped straight down from rest. Plastic balls use the
; plastic color; rubber balls would otherwise look too close to the sprite's default red, so they
; override their color.
[BallRubberOnConcrete]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnConcrete]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic

[BallRubberOnWood]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnWood]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic
