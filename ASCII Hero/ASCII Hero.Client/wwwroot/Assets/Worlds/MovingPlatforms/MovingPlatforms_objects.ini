
[ObjectCodes]
0 = Player
1 = SteelHorizontal
2 = SteelVertical
3 = BrickMiddle
4 = SnakeOne
5 = SnakeTwo
6 = Chainsaw

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HazardHitEffectClip = hurt
DiedEffectClip = died
WalkForceMultiplier = 40 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Middle platform the player starts on.
[BrickMiddle]
; --- Identity ---
Material = Brick
Width = 20
Height = 1
Kind = StaticObject

; Platform sliding left and right. Anything standing on it is carried along.
[SteelHorizontal]
; --- Identity ---
Material = Steel
Width = 8
Height = 1
Kind = KinematicObject
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 5 ; Leftmost column of the route
PatrolMaxX = 24 ; Rightmost column of the route
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 4 ; Speed in cells/second (always positive)

; Platform sliding up and down. Anything standing on it is carried along.
[SteelVertical]
; --- Identity ---
Material = Steel
Width = 8
Height = 1
Kind = KinematicObject
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (vertical) ---
PatrolMinY = 8 ; Topmost row of the route
PatrolMaxY = 23 ; Bottommost row of the route
; PatrolInitialDirectionY = Up ; Up or Down (default = toward the farther end of the route)
PatrolSpeedY = 2 ; Speed in cells/second (always positive)

; Saw blade sweeping above the middle platform. The player has to time jumps to get past it.
; The right limit keeps it clear of the vertical steel platform.
[Chainsaw]
; --- Identity ---
Asset = Chainsaw
Clip = default
Kind = KinematicHazard
; --- Combat ---
Sound = Hurt ; Played when the player is hurt by touching it
Killable = false ; Cannot be squashed
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 22 ; Leftmost column of the route
PatrolMaxX = 36 ; Rightmost column of the route
PatrolInitialDirectionX = Right ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 5 ; Speed in cells/second (always positive)

; Walking enemy riding the horizontally sliding steel platform. It patrols that platform from edge
; to edge, wherever the platform currently is, and never walks off it.
[SnakeOne]
; --- Identity ---
Asset = Snake
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
; --- Patrol ---
Patrol = true ; Patrols back and forth
PatrolStayOnPlatform = true ; Route follows the platform it stands on (default = false)
; --- Patrol (horizontal) ---
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolCruiseSpeedX = 6 ; Target speed in cells/second (default 6)
PatrolForceMultiplierX = 60 ; How quickly it reaches that speed (default 60)
; --- Material (default = from the resolved Material) ---
Friction = ; Override Friction
Restitution = ; Override Restitution
Density = ; Override Density

; Walking enemy confined to the right-hand part of its platform.
[SnakeTwo]
; --- Identity ---
Asset = Snake
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
; --- Patrol ---
Patrol = true ; Patrols back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 64 ; Leftmost column of the route
PatrolMaxX = 68 ; Rightmost column of the route
PatrolCruiseSpeedX = 6 ; Target speed in cells/second (default 6)
PatrolForceMultiplierX = 10 ; How quickly it reaches that speed (default 60)
; --- Material (default = from the resolved Material) ---
Friction = ; Override Friction
Restitution = ; Override Restitution
Density = ; Override Density
