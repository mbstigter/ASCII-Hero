
[ObjectCodes]
0 = Player
1 = SteelHorizontal
2 = SteelVertical
3 = BrickMiddle
4 = SnakeOne
5 = SnakeTwo

[Player]
Asset = Player
Clip = walk_idle
Kind = Player

; Static brick platform in the middle of the world - where the player naturally lands after
; falling from spawn - flanked by a moving steel platform on either side (see below) so both can
; be reached by walking off either end.
[BrickMiddle]
Asset = BrickPlatform
Clip = default
Kind = StaticObject
Repeat = 20

; Patrols purely horizontally between columns 5 and 24 at a constant row - demonstrates a rider
; being carried/dragged along by friction (see CollisionSystem's reference-frame collision
; generalization) as the platform itself moves out from underneath/back under them.
[SteelHorizontal]
Asset = SteelPlatform
Clip = default
Kind = KinematicObject
Repeat = 8
Patrol = true
PatrolMinX = 5
PatrolMaxX = 24
; PatrolSpeedX is always a positive magnitude (cells/second), never a direction: every frame
; KinematicObject2D.Move derives the sign of Velocity.X from whichever bound is currently being
; approached (+ moving right toward PatrolMaxX, - moving left toward PatrolMinX) - a negative
; PatrolSpeedX would invert that and make it flee its target bound instead of approach it, so
; keep this positive.
PatrolSpeedX = 8
; PatrolInitialDirectionX explicitly pins the starting heading ('Min' or 'Max') instead of
; relying on the default inference (toward whichever bound is farther from spawn) - set here so
; this platform is guaranteed to start moving left, away from the brick platform, letting the
; player watch it depart before it comes back.
PatrolInitialDirectionX = Min

; Patrols purely vertically between rows 8 and 18 at a constant column - demonstrates a rider
; being carried up/down for free (the vertical snap-onto-top-surface collision correction runs
; every frame against wherever the platform currently is).
[SteelVertical]
Asset = SteelPlatform
Clip = default
Kind = KinematicObject
Repeat = 8
Patrol = true
PatrolMinY = 8
PatrolMaxY = 18
; PatrolSpeedY is likewise always a positive magnitude, never a direction (see PatrolSpeedX above
; on SteelHorizontal) - KinematicObject2D.Move derives the sign of Velocity.Y each frame from
; whichever bound (PatrolMinY/PatrolMaxY) is currently being approached (+ moving down toward
; PatrolMaxY, - moving up toward PatrolMinY). No PatrolInitialDirectionY override here - it's left
; to the default inference (toward whichever bound is farther from spawn).
PatrolSpeedY = 6

[SnakeOne]
Asset = Snake
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
; No PatrolMinX/PatrolMaxX override - patrols the full world width (see docs/AssetFormat.md).
; PatrolForce raised above MovingEnemy2D's default so this snake visibly patrols faster than
; SnakeTwo below, and PatrolInitialDirection makes it set off to the right the instant the level
; loads rather than relying on the default (toward-the-farther-bound) inference.
PatrolForce = 0 ; Default = 60
PatrolInitialDirection = Left

[SnakeTwo]
Asset = Snake
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
; Confined to the wood platform it starts on (row 13, columns 30-67 (taking into account snake's widht) inclusive - see
; Enemies_objects.txt) rather than the full world, so it patrols back and forth across just its
; own platform instead of walking off either end into open air.
PatrolMinX = 64
PatrolMaxX = 68
; No PatrolForce override - patrols at the default strength (60, see docs/AssetFormat.md), slower
; than SnakeOne above.
