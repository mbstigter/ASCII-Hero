[World]
Title = Moving Platforms

[Layout]
EmptyChar = '.' ; Non-space so a cell can be left blank in a grid file without relying on
				; trailing spaces - still renders as fully transparent either way.

[Colors]
; Fallback color for any cell that has no color of its own and whose sprite has no default
; color either.
DefaultForegroundColor = G
; DefaultBackgroundColor left unset, so those cells stay fully transparent.

[Physics]
; Ordinary gravity - the player free-falls from spawn onto the static brick platform in the
; middle, then can walk off onto either moving steel platform to see it carried horizontally or
; vertically.
Gravity = 40 ; Default is 40

[Animation]
FrameDurationSeconds = 0.3
Mode = PingPong