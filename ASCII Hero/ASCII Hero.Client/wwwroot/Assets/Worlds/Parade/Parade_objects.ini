; A showcase of every bird and fish. Each creature swims or flies straight back and forth between
; the same two columns on its own row, and a still copy of it hovers at the right edge of that same
; row so both its moving and its idle look can be seen side by side. Birds fly in the air above,
; fish swim in the pool below.

[ObjectCodes]
0 = Player
1 = StoneFloor
2 = StoneLedge
3 = PoolSurface
4 = Pool
M = Raft
A = SilvereyeParade
B = CardinalParade
C = LovebirdParade
D = GoldfishParade
E = BluetangParade
F = EmeraldParade
G = SilvereyeIdle
H = CardinalIdle
I = LovebirdIdle
J = GoldfishIdle
K = BluetangIdle
L = EmeraldIdle

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died

; Solid stone along the bottom of the world.
[StoneFloor]
; --- Identity ---
Material = Stone
Width = 80
Height = 2
Kind = StaticObject

; A stone ledge on the left for the player to start on, next to the pool.
[StoneLedge]
; --- Identity ---
Material = Stone
Width = 4
Height = 11
Kind = StaticObject

; The pool, made of a one-row surface with gently animated waves and the body below it drawn
; empty. Both can be swum through.
[PoolSurface]
; --- Identity ---
Asset = WaterSurface
Clip = horizontal
Span = 72 ; Length in cells
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through
Medium = true ; Acts as water (buoyancy and drag)

[Pool]
; --- Identity ---
Material = Water
Width = 72
Height = 10
Kind = StaticObject
Character = ' '
; --- Behavior ---
Passable = true ; Can be walked through
Medium = true ; Acts as water (buoyancy and drag)

; A loose wooden raft floating in the middle of the pool. It rides the water, dips a little
; under the player's weight and drifts when pushed. Jump from it to bump the birds, or dive off
; it to bump the fish.
[Raft]
; --- Identity ---
Material = Wood
Width = 20
Height = 2
Kind = DynamicObject

; --- Parading birds ---
; Each flies straight back and forth on its own row, between the same two columns, and
; flaps back up to that row when bumped off it.

[SilvereyeParade]
; --- Identity ---
Asset = Bird/Silvereye
Clip = move_idle
Kind = DynamicObject
; --- Patrol ---
Patrol = true ; Patrols back and forth
PatrolMinX = 10 ; Leftmost column of the route
PatrolMaxX = 65 ; Rightmost column of the route
PatrolInitialDirectionX = Right ; Left or Right
PatrolCruiseSpeedX = 5 ; Target speed in cells/second (default 6)
; --- Patrol (vertical) ---
PatrolCruiseSpeedY = 8 ; Target speed in cells/second when returning to its row (default 6)
PatrolForceMultiplierY = 17 ; How quickly it reaches that speed (default 33)
PatrolMaxForceY = 1.5 ; Wing strength cap in multiples of its own weight (default 0 = no vertical thrust)

