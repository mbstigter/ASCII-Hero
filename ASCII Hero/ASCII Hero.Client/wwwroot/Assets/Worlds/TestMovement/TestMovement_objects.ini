
[ObjectCodes]
0 = Player
1 = BouncingBall
2 = WallHorizontal
3 = WallVertical
S = Diamond
R = Ring
T = ToxicPlant
D = BigDiamond

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HazardHitEffectClip = hurt ; Played when hurt without dying, e.g. bumping into a plant from the side
DiedEffectClip = died
WalkForceMultiplier = 22 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Walls enclosing the test box. They give back all of a bounce's energy, so the bouncing ball
; never slows down; their grip comes from their material, so the player walks on them normally.
[WallHorizontal]
; --- Identity ---
Material = Stone
Width = 120
Height = 2
Kind = StaticObject
; --- Material (default = from the resolved Material) ---
Restitution = 1.0

[WallVertical]
; --- Identity ---
Material = Stone
Width = 2
Height = 21
Kind = StaticObject
; --- Material (default = from the resolved Material) ---
Restitution = 1.0

; Weightless and perfectly elastic, so it bounces around forever inside the enclosed box
; instead of settling under gravity.
[BouncingBall]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
; --- Motion ---
GravityAffected = false
InitialVelocityX = 20
InitialVelocityY = 20
; --- Material (default = from the resolved Material) ---
Friction = 0.0
Restitution = 1.0

; A big bulging shape for checking collisions against a curved, notched outline. It reacts to
; being bumped, but is heavy and draggy enough that an ordinary walking bump won't budge it, so
; its edges can be poked at without it sliding around underfoot.
[BigDiamond]
; --- Identity ---
Asset = BigDiamond
Clip = default
Kind = DynamicObject
ForegroundColor = J
; --- Motion ---
GravityAffected = true
; --- Material (default = from the resolved Material) ---
Density = 6.0
Friction = 1.0
Restitution = 0.0

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
Sound = DiamondPickup

[Ring]
; --- Identity ---
Asset = Ring
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Ring
EffectClip = fade
Sound = RingPickup

; Hazard that can be squashed by landing on top of it. The squashed husk stays in the world.
[ToxicPlant]
; --- Identity ---
Asset = Plant
Clip = medium
Kind = StaticHazard
; --- Combat ---
Damage = 0.2 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
EffectClip = crumble ; Played when squashed
EffectPersists = true ; The squashed husk stays in the world
