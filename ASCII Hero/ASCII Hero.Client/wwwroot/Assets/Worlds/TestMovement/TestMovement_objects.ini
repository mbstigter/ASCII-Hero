
[ObjectCodes]
0 = Player
1 = BouncingBall
2 = WallHorizontal
3 = WallVertical
S = Diamond
R = Ring
T = ToxicPlant
D = BigDiamond

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
; Plays the Player asset's "hurt" clip
; ordinary (non-fatal) hazard contact, e.g. bumping into ToxicPlant from the side or below.
HazardHitEffectClip = hurt
DiedEffectClip = died
WalkForce
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[WallHorizontal]
Material = Stone
Width = 120
Height = 2
Kind = StaticObject
Restitution = 1.0
Friction = 0.0

[WallVertical]
Material = Stone
Width = 2
Height = 21
Kind = StaticObject
Restitution = 1.0
Friction = 0.0

[BouncingBall]
Asset = Ball
Clip = default
Kind = DynamicObject
; Weightless and perfectly elastic, so it bounces around forever inside the enclosed box
; instead of settling under gravity.
GravityAffected = false
Restitution = 1.0
Friction = 0.0
InitialVelocityX = 20
InitialVelocityY = 20

[Diamond]
Asset = Diamond
Clip = default
Kind = Collectable
Type = Diamond
EffectClip = fade
Sound = DiamondPickup

[Ring]
Asset = Ring
Clip = default
Kind = Collectable
Type = Ring
EffectClip = fade
Sound = RingPickup

[ToxicPlant]
Asset = ToxicPlant
Clip = idle
Kind = StaticHazard
Damage = 0.2 ; Share of a full health bar removed per hit (default 1 = a whole bar)
; Landing on top of this instance kills it (see IKillableBody) instead of just registering as an
; ordinary hazard hit. EffectClip plays the "crumble" clip on the kill contact specifically;
; EffectPersists keeps the resulting husk (shrunk to a residue on the bottom row) in the world
; permanently instead of it self-removing like an ordinary effect.
Killable = true
EffectClip = crumble
EffectPersists = true
Sound = Hurt
KillSound = Squash

[BigDiamond]
; A non-monotonic (bulging) test shape for verifying CollisionShapeBuilder's collision-rectangle
; derivation against a curved/notched silhouette (see the ball pass-through fix). Kind =
; DynamicObject so it genuinely reacts to being bumped rather than being a fully immovable
; obstacle, but a high Density (on top of its already-large 9x9 footprint, which itself
; increases Mass = Density * Size.X * Size.Y) and high Friction make it heavy/draggy enough
; that an ordinary walking bump won't budge it in practice - good for poking at its edges
; without it constantly sliding around underfoot.
Asset = BigDiamond
Clip = default
Kind = DynamicObject
GravityAffected = true
Density = 6.0
Restitution = 0.0
Friction = 1.0
ForegroundColor = J
