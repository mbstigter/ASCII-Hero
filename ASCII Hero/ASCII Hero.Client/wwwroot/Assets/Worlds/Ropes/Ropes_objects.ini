; A playground for ropes: ropes you climb, ropes you hang from, and ropes that keep pulling you
; along.

[ObjectCodes]
0 = Player
G = Ground
D = Diamond
L = LevelEnd
A = Ledge
W = Wall
S = RopeAnchorVertical
H = RopeAnchorHorizontal
1 = RopeVertical
2 = RopeHorizontal
3 = RopeVerticalUp
4 = RopeHorizontalLeft
5 = RopeHorizontalRight
6 = RopeVerticalDown
R = GrassFloor
V = WallPlantLeftOfWall
Y = WallPlantRightOfWall
K = GrassHangingLedge
B = ExitDoor
E = ExitKey

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HazardHitEffectClip = hurt
DiedEffectClip = died
LevelEndReachedEffectClip = levelendreached

; Floor running the full width of the world.
[Ground]
; --- Identity ---
Material = Limestone
Width = 100
Height = 1
Kind = StaticObject

; Green grass growing along the whole floor. Purely decorative: the player walks straight through it.
[GrassFloor]
; --- Identity ---
Asset = Grass
Clip = floor_green
Kind = StaticObject
Span = 100 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through

; Toxic plant (red and orange tips) growing out of the left face of the tall wall. Mildly toxic: brushing against it hurts a little, but the player can still pass through it.
[WallPlantLeftOfWall]
; --- Identity ---
Asset = WallPlant
Clip = rightwall_toxic
Kind = StaticHazard
; --- Combat ---
Damage = 0.1 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it

; Green plant growing out of the right face of the tall wall. Purely decorative: the player walks straight through it.
[WallPlantRightOfWall]
; --- Identity ---
Asset = WallPlant
Clip = leftwall_brown
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Short tuft of dry, brown grass hanging under a ledge. Place it directly below the ledge. Purely decorative: the player walks straight through it.
[GrassHangingLedge]
; --- Identity ---
Asset = Grass
Clip = hanging_brown
Kind = StaticObject
Span = 8 ; Length in cells (width), matching the ledge
; --- Behavior ---
Passable = true ; Can be walked through

; Short limestone ledge.
[Ledge]
; --- Identity ---
Material = Limestone
Width = 8
Height = 1
Kind = StaticObject

; Tall limestone wall, 1 wide and 28 high. Blocks the way; the grid marker is its top cell.
[Wall]
; --- Identity ---
Material = Limestone
Width = 1
Height = 28
Kind = StaticObject

; Single stone that a hanging rope is tied to. Place it directly above the top of a
; vertical rope. Purely decorative: the player passes straight through it.
[RopeAnchorVertical]
; --- Identity ---
Material = Limestone
Character = Ω
ForegroundColor = B ; Limestone colour
BackgroundColor = 5 ; Dark but not black
Width = 1
Height = 1
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Single stone that a stretched rope is tied to.
; directly right of a horizontal rope. Purely decorative: the player passes straight through it.
[RopeAnchorHorizontal]
; --- Identity ---
Material = Limestone
Character = §
ForegroundColor = B ; Limestone colour
BackgroundColor = 5 ; Dark but not black
Width = 1
Height = 1
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; --- Ropes ---

; Hanging rope, 8 cells tall. Climb it.
[RopeVertical]
; --- Identity ---
Asset = Rope
Clip = vertical
Kind = StaticObject
Span = 8 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Stretched rope, 12 cells wide. Hang from it and move along.
[RopeHorizontal]
; --- Identity ---
Asset = Rope
Clip = horizontal
Kind = StaticObject
Span = 12 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from

; Hanging rope that keeps pulling upward, 9 cells tall.
[RopeVerticalUp]
; --- Identity ---
Asset = Rope
Clip = vertical_up
Kind = StaticObject
Span = 9 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Up ; Which way the rope moves: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; Stretched rope that keeps pulling to the left, 12 cells wide.
[RopeHorizontalLeft]
; --- Identity ---
Asset = Rope
Clip = horizontal_left
Kind = StaticObject
Span = 12 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Conveyor ---
ConveyorDirection = Left ; Which way the rope moves: Left or Right
ConveyorSpeed = 3 ; Speed in cells/second

; Stretched rope that keeps pulling to the right, 12 cells wide.
[RopeHorizontalRight]
; --- Identity ---
Asset = Rope
Clip = horizontal_right
Kind = StaticObject
Span = 12 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Conveyor ---
ConveyorDirection = Right ; Which way the rope moves: Left or Right
ConveyorSpeed = 3 ; Speed in cells/second

; Hanging rope that keeps pulling downward, 9 cells tall.
[RopeVerticalDown]
; --- Identity ---
Asset = Rope
Clip = vertical_down
Kind = StaticObject
Span = 9 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Down ; Which way the rope moves: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; --- Pickups ---

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
Sound = DiamondPickup

; Touching this finishes the level.
[LevelEnd]
; --- Identity ---
Asset = LevelEnd
Clip = default
Kind = Collectable
; --- Pickup ---
Type = LevelEnd
EffectClip = reached
EffectPersists = true ; Stays in place once reached
Sound = LevelEnd

; Locked door just before the level end. It opens when the player carries the gold key and
; presses the action key (E or Enter) next to it. Opening it uses up the key, and it then stays
; open. Place it standing on the ground, between the player's route and the level end.
[ExitDoor]
; --- Identity ---
Asset = Door
Clip = closed
OnClip = open
Span = 8 ; Length in cells
Kind = Gate
ForegroundColor = Y
; --- Lock ---
Lock = Exit
Sound = DoorOpen

; Gold key on the top platform. Opens the door to the level end.
[ExitKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = Y
; --- Pickup ---
Type = Key
Lock = Exit ; Opens the door to the level end
Sound = KeyPickup
