; --- Shared pieces in Ancient colors ---

; Wooden ladder, 16 cells tall. Climb it.
[AncientLadder]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = StaticObject
Span = 16 ; Length in cells (height)
ForegroundColor = A
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Wooden door, locked, 8 cells tall. Stand it on the ground under a short wall. It opens when the
; player carries the bronze key and presses the action key (E or Enter) next to it. Opening it uses
; up the key, and it then stays open.
[AncientDoor]
; --- Identity ---
Asset = Door
Clip = closed
ClipWhenOn = open
Kind = Gate
Span = 8 ; Length in cells (height)
; --- Lock ---
Lock = Ancient
Sound = DoorOpen

; Bronze key on top of the first building. Opens the locked door.
[AncientKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = X
; --- Pickup ---
Type = Key
Lock = Ancient ; Opens the locked door
Sound = KeyPickup

; Steel hatch in the ceiling of the building on the right, 6 cells wide. The button inside the
; building opens it, and pressing the button again closes it.
[AncientHatch]
; --- Identity ---
Asset = Hatch
Clip = closed
ClipWhenOn = open
Kind = Gate
Material = Steel
Span = 6 ; Length in cells (width)
; --- Link ---
Link = AncientHatch ; Opened and closed by the switch with the same link

; Button inside the building on the right, next to its right-hand wall. Press the action key
; (E or Enter) next to it to open the hatch in the ceiling; press it again to close the hatch.
[AncientButton]
; --- Identity ---
Asset = Button
Clip = off
ClipWhenOn = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once pressed; false = every press toggles it
Link = AncientHatch
Sound = SwitchClick
