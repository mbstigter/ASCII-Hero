; Studded stone door, locked, 8 cells tall. Stand it on the ground under a short wall. It opens when the
; player carries the bronze key and presses the action key (E or Enter) next to it. Opening it uses
; up the key, and it then stays open.
[AncientDoor]
; --- Identity ---
Asset = Door
Clip = ancient_closed
ClipWhenOn = ancient_open
Material = AncientStone
Kind = Gate
Span = 8 ; Length in cells (height)
; --- Lock ---
Lock = Ancient
Sound = GateUnlock

; Bronze key on top of the first building. Opens the locked door.
[AncientKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = X
; --- Pickup ---
Type = Key
Lock = Ancient ; Opens the locked door
Sound = KeyPickup

; Stone hatch in the ceiling of the building on the right, 6 cells wide. The button inside the
