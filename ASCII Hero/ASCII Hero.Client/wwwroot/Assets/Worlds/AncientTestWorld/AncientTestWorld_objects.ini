; --- Anchors and ropes ---

; Rounded stone block (3x3) to hang a vertical rope from. Start the rope on the block's bottom row, in its middle column.
; Purely decorative: the player passes straight through it.
[AncientAnchorVertical]
; --- Identity ---
Asset = AnchorVertical
Clip = ancient
Material = AncientStone
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Rounded stone block (3x3) at the left end of a stretched rope. Start the rope on the block's right edge, level with its
; middle row.
[AncientAnchorHorizontalLeft]
; --- Identity ---
Asset = AnchorHorizontal
Clip = ancient_left
Material = AncientStone
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Rounded stone block (3x3) at the right end of a stretched rope. Place it directly right of the rope, with its
; middle row level with the rope. Purely decorative: the player passes straight through it.
[AncientAnchorHorizontalRight]
; --- Identity ---
Asset = AnchorHorizontal
Clip = ancient_right
Material = AncientStone
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Hanging rope, 12 cells tall. Climb it. It stands still until the lever on the ground floor is
; switched on; then it keeps pulling upward until the lever is switched off again.
[AncientRopeVertical]
; --- Identity ---
Asset = Rope
Clip = vertical
ClipWhenOn = vertical_up
Kind = Device
Span = 12 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Link ---
Link = AncientRope ; Switched on and off by the lever with the same link
; --- Conveyor ---
ConveyorDirection = Up ; Which way the rope moves while on: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; Lever on the ground floor next to the hanging rope. Operate it with the action key (E or Enter)
; next to it to start the hanging rope pulling upward; operate it again to stop the rope.
[AncientLever]
; --- Identity ---
Asset = Lever
Clip = ancient_off
ClipWhenOn = ancient_on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once operated; false = every operation toggles it
Link = AncientRope
Sound = SwitchClick

; Stretched rope, 14 cells wide. Hang from it and move along.
[AncientRopeHorizontal]
; --- Identity ---
Asset = Rope
Clip = horizontal
Kind = StaticObject
Span = 14 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from

