; --- Anchors and ropes ---

; Stone block to hang a vertical rope from. Place it with the rope directly below its middle cell.
; Purely decorative: the player passes straight through it.
[AncientAnchorVertical]
; --- Identity ---
Asset = AnchorVertical
Clip = ancient
Material = AncientStone
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Stone block at the left end of a stretched rope. Place the rope directly right of it, level with its
; middle row. Purely decorative: the player passes straight through it.
[AncientAnchorHorizontalLeft]
; --- Identity ---
Asset = AnchorHorizontal
Clip = ancient_left
Material = AncientStone
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Stone block at the right end of a stretched rope. Place it directly right of the rope, with its
; middle row level with the rope. Purely decorative: the player passes straight through it.
[AncientAnchorHorizontalRight]
; --- Identity ---
Asset = AnchorHorizontal
Clip = ancient_right
Material = AncientStone
Kind = StaticObject
