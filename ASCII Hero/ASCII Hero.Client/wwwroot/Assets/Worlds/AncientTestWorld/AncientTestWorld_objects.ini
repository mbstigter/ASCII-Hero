; Showcase of the Ancient building kit: every component once, so the style can be judged at a glance.
; From left to right: solid colonnade carrying a platform (with a ladder), background colonnade with
; frieze and medallions, a hanging rope and a stretched rope on stone anchors, then a small walled
; building with a locked door (its key lies on top of the first building) and a hatch in its ceiling,
; opened by a button inside.

[ObjectCodes]
0 = Player
G = AncientFloorGround
F = AncientFloor
C = AncientColumn
T = AncientColumnCapital
B = AncientColumnBase
Q = AncientColumnBackground
W = AncientColumnCapitalBackground
Y = AncientColumnBaseBackground
V = AncientAnchorVertical
L = AncientAnchorHorizontalLeft
R = AncientAnchorHorizontalRight
1 = AncientRopeVertical
2 = AncientRopeHorizontal
O = AncientOrnament1
S = AncientOrnament2
H = AncientLadder
X = AncientWall
Z = AncientWallShort
U = AncientKey
D = AncientDoor
K = AncientHatch
M = AncientButton
N = LevelEnd

[Player]
