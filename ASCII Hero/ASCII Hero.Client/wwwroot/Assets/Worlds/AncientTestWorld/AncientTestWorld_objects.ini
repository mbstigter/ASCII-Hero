; Showcase of the Ancient building kit: every component once, so the style can be judged at a glance.
; From left to right: solid colonnade carrying a platform (with a ladder), decayed background colonnade
; carrying a floor, with medallions and ladders and pipes to climb and hang from, a hanging rope (pulled upward
; by a lever on the ground floor) and a stretched rope on stone anchors, then a small walled
; building with a locked door (its key lies on top of the first building) and a hatch in its ceiling,
; opened by a button inside.

