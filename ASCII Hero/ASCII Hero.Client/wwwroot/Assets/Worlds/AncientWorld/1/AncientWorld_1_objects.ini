; Sub-world 1 of the Ancient world: a bare chamber below the main world's floor portal.
; Only the object placements live here; settings, colours, materials, sounds and sprites come from the main world.
; Walk into the portal on the right to return to the main world.

[ObjectCodes]
0 = Player
1 = PlayerFromMain
G = AncientFloorGround
D = AncientDoorPortal
2 = Diamond

; The player's starting position when this sub-world is entered without a named arrival spot.
[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtSound = PlayerHurt
KillSound = PlayerKill
HurtEffectClip = hurt
DiedEffectClip = died
CheckpointReachedEffectClip =
WorldEndReachedEffectClip = worldendreached
HealedEffectClip = healed
PortalEnteredEffectClip = portalentered
PortalEnteredSound = PortalEnteredWoosh
PortalArrivedEffectClip = portalarrived
PortalArrivedSound = PortalArrivedWoosh

; Arrival spot used by the main world's floor portal. It is invisible; the player simply appears here.
[PlayerFromMain]
Asset = Player
Clip = walk_idle
Kind = Player
Entry = FromMain ; Arrival spot name

; Floor slab across the whole chamber.
[AncientFloorGround]
; --- Identity ---
Asset = Floor
Clip = ancient
Material = AncientStone
Kind = StaticObject
Span = 60 ; Length in cells (width)

; Portal at the right end. Walk into it to go back up to the main world, next to the floor portal.
[AncientDoorPortal]
; --- Identity ---
Asset = Portal
Clip = vertical
Kind = Portal
Span = 8 ; Length in cells (height)
; --- Destination ---
TargetWorld = 0 ; Sub-world number (0 is the main world)
TargetEntry = FromSubWorld ; Arrival spot in the main world

; Diamond lying just above the floor. Collecting one scores points.
[Diamond]
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
CollectSound = DiamondPickup
