Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Walking enemy: patrols the full world width and is pulled down by gravity.
; Patrol = true alone means "patrol the full width". Vertical force is 0 by default, so it just falls and stands on the floor.
[SnakeOne]
; --- Identity ---
Asset = Snake
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
; Damage = 1 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
; --- Patrol ---
Patrol = true ; Patrols back and forth
; --- Patrol (horizontal) ---
; PatrolMinX = 0 ; Leftmost column of the route (default = left edge of the world)
; PatrolMaxX = 100 ; Rightmost column of the route (default = right edge of the world)
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolCruiseSpeedX = 6 ; Target speed in cells/second (default 6)
PatrolForceMultiplierX = 17 ; How quickly it reaches that speed (default 33)
; PatrolMaxForceX = 1 ; Sideways strength cap in multiples of its own weight (default = no cap)
; --- Material (default = from the resolved Material) ---
Friction = ; Override Friction
Restitution = ; Override Restitution
Density = ; Override Density

