; --- Patrol (horizontal) ---
; PatrolMinX = 10 ; Leftmost column of the route (no range = holds its starting column)
; PatrolMaxX = 70 ; Rightmost column of the route
; PatrolInitialDirectionX = Left ; Left or Right (only with a horizontal range)
PatrolCruiseSpeedX = 6 ; Target speed in cells/second when returning to its column (default 6)
PatrolForceMultiplierX = 22 ; How quickly it reaches that speed (default 33)
PatrolMaxForceX = 1.0 ; Sideways strength cap in multiples of its own weight (default = no cap)
; --- Patrol (vertical) ---
PatrolMinY = 2 ; Highest row of the route
PatrolMaxY = 18 ; Lowest row of the route
PatrolInitialDirectionY = Up ; Up or Down (default = toward the farther end of the route)
PatrolCruiseSpeedY = 5 ; Target speed in cells/second (default 6)
PatrolForceMultiplierY = 22 ; How quickly it reaches that speed (default 33)
PatrolMaxForceY = 2.0 ; Wing strength cap in multiples of its own weight (default 0 = no vertical thrust)
; --- Material (default = from the resolved Material) ---
Friction = ; Override Friction
Restitution = ; Override Restitution
Density = ; Override Density

