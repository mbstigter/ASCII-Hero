; Flying enemy, level flight: patrols columns 10-70 and holds the row it is placed on.
; An axis with no range holds its starting position and returns to it after being bumped.
; Whether it can actually push on an axis is set only by that axis' PatrolMaxForce (strength cap).
; Vertical force defaults to 0, so PatrolMaxForceY is what lets it fly: 1 = can just hover, above 1 = can also climb.
[ButterflyOne]
; --- Identity ---
Asset = Butterfly
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Damage = 0.5 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
; --- Patrol ---
Patrol = true ; Patrols back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 10 ; Leftmost column of the route (default = left edge of the world)
PatrolMaxX = 70 ; Rightmost column of the route (default = right edge of the world)
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolCruiseSpeedX = 10 ; Target speed in cells/second (default 6)
PatrolForceMultiplierX = 17 ; How quickly it reaches that speed (default 33)
; PatrolMaxForceX = 1 ; Sideways strength cap in multiples of its own weight (default = no cap)
; --- Patrol (vertical) ---
; PatrolMinY = 2 ; Highest row of the route (no range = holds its starting row)
; PatrolMaxY = 18 ; Lowest row of the route
; PatrolInitialDirectionY = Up ; Up or Down (only with a vertical range)
PatrolCruiseSpeedY = 10 ; Target speed in cells/second when returning to its row (default 6)
PatrolForceMultiplierY = 17 ; How quickly it reaches that speed (default 33)
PatrolMaxForceY = 1.5 ; Wing strength cap in multiples of its own weight (default 0 = no vertical thrust)
; --- Material (default = from the resolved Material) ---
Friction = ; Override Friction
Restitution = ; Override Restitution
Density = ; Override Density

; Flying enemy, vertical flight: patrols rows 2-18 and holds the column it is placed in.
; Climbing needs strong wings (above 1); descending mostly lets gravity do the work.
[ButterflyTwo]
; --- Identity ---
Asset = Butterfly
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Damage = 0.5 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = Squash ; Played when the player squashes it from above
; --- Patrol ---
