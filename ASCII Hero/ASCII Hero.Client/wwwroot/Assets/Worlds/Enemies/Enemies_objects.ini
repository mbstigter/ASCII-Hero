
[ObjectCodes]
0 = Player
1 = SnakeOne
2 = SnakeTwo
3 = FloorWood
4 = ButterflyOne
5 = ButterflyTwo

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
EffectClip = spark
WalkForceMultiplier = 40 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[SnakeOne]
Asset = Snake
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
; No PatrolMinX/PatrolMaxX override - patrols the full world width (see docs/AssetFormat.md).
; PatrolForce raised above MovingEnemy2D's default so this snake visibly patrols faster than
; SnakeTwo below, and PatrolInitialDirectionX makes it set off to the right the instant the level
; loads rather than relying on the default (toward-the-farther-bound) inference.
PatrolForceMultiplier = 30 ; Default = 60
PatrolCruiseSpeedX = 6 ; Default = MovingEnemy2D.DefaultPatrolCruiseSpeed
PatrolInitialDirectionX = Left
; PatrolInitialDirectionY ('Up' or 'Down') is parsed and stored for a future vertically-
; patrolling MovingEnemy, but has no effect yet - MovingEnemy2D only patrols horizontally today.
; Left commented out here since setting it would be misleading before it actually does anything.
; PatrolInitialDirectionY = Down
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[SnakeTwo]
Asset = Snake
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
; Confined to the wood platform it starts on (row 13, columns 30-67 (taking into account snake's widht) inclusive - see
; Enemies_objects.txt) rather than the full world, so it patrols back and forth across just its
; own platform instead of walking off either end into open air.
PatrolMinX = 30
PatrolMaxX = 67
; No PatrolForceMultiplier override - patrols at the default strength (60, see docs/AssetFormat.md), slower
; than SnakeOne above.
PatrolCruiseSpeedX = 6 ; Default = MovingEnemy2D.DefaultPatrolCruiseSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[FloorWood]
Material = Wood
Width = 40
Height = 1
Kind = StaticObject

[ButterflyOne]
Asset = Butterfly
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
GravityAffected = false
PatrolMinX = 10
PatrolMaxX = 70
PatrolForceMultiplier = 30 ; Default = 60
PatrolCruiseSpeedX = 10 ; Default = MovingEnemy2D.DefaultPatrolCruiseSpeed
PatrolInitialDirectionX = Left
; PatrolInitialDirectionY ('Up' or 'Down') is parsed and stored for a future vertically-
; patrolling MovingEnemy, but has no effect yet - MovingEnemy2D only patrols horizontally today.
; Left commented out here since setting it would be misleading before it actually does anything.
; PatrolInitialDirectionY = Down
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

[ButterflyTwo]
Asset = Butterfly
Clip = move_idle
Kind = MovingEnemy
Killable = true
Patrol = true
GravityAffected = false
PatrolMinY = 2
PatrolMaxY = 18
PatrolForceMultiplier = 40 ; Default = 60
PatrolCruiseSpeedX = 8 ; Default = MovingEnemy2D.DefaultPatrolCruiseSpeed
PatrolInitialDirectionY = Up
; This butterfly only patrols vertically (no PatrolMinX/PatrolMaxX set), between rows 2 and 20.
; GravityAffected = false means the climb (Up) and glide (Down) legs are symmetric; set it to
; true instead for an enemy that has to work harder to climb than to descend (gravity is
; cancelled out while heading up so it can still reach its climb speed, but left alone while
; heading down so gravity's own pull carries most of the descent).
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)
