; A playground for ladders and pipes that move, and for vertical conveyors that stay in place but
; whose rungs keep moving, plus a horizontal conveyor belt floor.
;

[ObjectCodes]
0 = Player
1 = Ground
2 = LadderLift
3 = LedgeOne
4 = PipeShuttle
5 = LedgeTwo
6 = ConveyorUp
7 = LedgeHigh
8 = ConveyorDown
A = LedgeLow
B = LadderFerry
C = PipeElevator
I = ElevatorButton
D = Diamond
E = LevelEnd
F = ConveyorRight
G = LaserVertical
H = LaserHorizontal
J = FlowerSmall
K = PlantSmall

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HazardHitEffectClip = hurt
DiedEffectClip = died
LevelEndReachedEffectClip = levelendreached

; Floor running the full width of the world.
[Ground]
; --- Identity ---
Material = Brick
Width = 100
Height = 1
Kind = StaticObject

; --- Moving ladders and pipes: the whole object travels along a route ---

; Ladder that rises and sinks. At its lowest it reaches the ground; at its highest its top lines
; up with the first ledge, so the player can step off to the right.
[LadderLift]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = KinematicObject
Span = 10 ; Length in cells
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (vertical) ---
PatrolMinY = 12 ; Topmost row of the route (top of the ladder)
PatrolMaxY = 25 ; Bottommost row of the route (top of the ladder)
PatrolInitialDirectionY = Up
PatrolSpeedY = 2 ; Speed in cells/second (always positive)

; Pipe sliding left and right above the gap between the first and second ledge. Jump up to it
; from the first ledge, hang on while it crosses, and drop onto the second ledge.
[PipeShuttle]
; --- Identity ---
Asset = Pipe
Clip = horizontal
Kind = KinematicObject
Span = 8 ; Length in cells
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 26 ; Leftmost column of the route (left end of the pipe)
PatrolMaxX = 42 ; Rightmost column of the route (left end of the pipe)
PatrolInitialDirectionX = Right ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 4 ; Speed in cells/second (always positive)

; Pipe that rises and sinks next to the exit ledge, as a shortcut up from the ground. Jump up to
; it, ride it up, and jump off to the left onto the exit ledge. It stands still until its button
; is switched on, and stops wherever it is when switched off again.
[PipeElevator]
; --- Identity ---
Asset = Pipe
Clip = horizontal
Kind = KinematicObject
Span = 7 ; Length in cells
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (vertical) ---
PatrolMinY = 17 ; Topmost row of the route (the pipe's row)
PatrolMaxY = 30 ; Bottommost row of the route (the pipe's row)
PatrolInitialDirectionY = Down ; Up or Down (default = toward the farther end of the route)
PatrolSpeedY = 2 ; Speed in cells/second (always positive)
; --- Link ---
Link = PipeElevator ; Moves only while the switch with the same link is on

; Short ladder sliding left and right along the ground.
[LadderFerry]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = KinematicObject
Span = 8 ; Length in cells
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 66 ; Leftmost column of the route (left edge of the ladder)
PatrolMaxX = 88 ; Rightmost column of the route (left edge of the ladder)
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 3 ; Speed in cells/second (always positive)

; --- Vertical conveyors: the object stays in place, but its rungs keep moving ---

; Upward conveyor from the second ledge
; climbing up as well gets you there faster.
[ConveyorUp]
; --- Identity ---
Asset = Conveyor
Clip = vertical_up
Kind = StaticObject
Span = 8 ; Length in cells (height)
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Up ; Which way the rungs move: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; Downward conveyor from the far end
[ConveyorDown]
; --- Identity ---
Asset = Conveyor
Clip = vertical_down
Kind = StaticObject
Span = 28 ; Length in cells (height)
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Down ; Which way the rungs move: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; --- Conveyor belts: a floor whose top surface keeps moving ---

; Low rubber belt near the start
; walk against it to stay in place. Loose objects resting on it are carried along too.
[ConveyorRight]
; --- Identity ---
Asset = Conveyor
Clip = horizontal_right
Kind = StaticObject
Span = 12 ; Length in cells (width)
; --- Conveyor ---
ConveyorDirection = Right ; Which way the belt moves: Left or Right
ConveyorSpeed = 4 ; Speed in cells/second

; --- Hazards ---

; Short laser beam hanging just above head height over the conveyor belt. Riding the belt is safe, but jumping hurts.
[LaserHorizontal]
; --- Identity ---
Asset = Laser
Clip = horizontal
Kind = StaticHazard
Span = 9 ; Length in cells (width)
; --- Behavior ---
Passable = true ; Can be jumped through (but still hurts)
; --- Combat ---
Damage = 0.1 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = false ; Cannot be destroyed

; Laser beam standing on the ground at the far left, 9 cells tall. Touching it hurts.
[LaserVertical]
; --- Identity ---
Asset = Laser
Clip = vertical
Kind = StaticHazard
Span = 9 ; Length in cells (height)
; --- Behavior ---
Passable = true ; Can be walked through (but still hurts)
; --- Combat ---
Damage = 0.1 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = false ; Cannot be destroyed

; --- Ledges ---

; First ledge, reached from the top of the rising ladder.
[LedgeOne]
; --- Identity ---
Material = Brick
Width = 18
Height = 1
Kind = StaticObject

; Second ledge, on the far side of the gap crossed with the sliding pipe.
[LedgeTwo]
; --- Identity ---
Material = Brick
Width = 14
Height = 1
Kind = StaticObject

; High ledge at the top of the upward conveyor.
[LedgeHigh]
; --- Identity ---
Material = Steel
Width = 26
Height = 1
Kind = StaticObject

; Exit ledge, reached by the pipe elevator.
[LedgeLow]
; --- Identity ---
Material = Wood
Width = 16
Height = 1
Kind = StaticObject

; --- Pickups ---

; --- Decoration: flowers and plants growing on the ground and ledges. Purely decorative: the player walks straight through them. ---

; Small pink bud, 2 tall. Place it directly on top of a floor or ledge.
[FlowerSmall]
; --- Identity ---
Asset = Flower
Clip = small
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

; Small swaying sprout, 2 tall. Place it directly on top of a floor or ledge.
[PlantSmall]
; --- Identity ---
Asset = Plant
Clip = small
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through

[Diamond]
; --- Identity ---
Asset = Diamond
Clip = default
Kind = Collectable
; --- Pickup ---
Type = Diamond
EffectClip = fade
Sound = DiamondPickup

; Touching this finishes the level.
[LevelEnd]
; --- Identity ---
Asset = LevelEnd
Clip = default
Kind = Collectable
; --- Pickup ---
Type = LevelEnd
EffectClip = reached
EffectPersists = true ; Stays in place once reached
Sound = LevelEnd

; Button that starts the pipe elevator. Press the action key (E or Enter) next to it to switch the
; elevator on and off.
[ElevatorButton]
; --- Identity ---
Asset = Button
Clip = off
OnClip = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once pressed; false = every press toggles it
Link = PipeElevator
Sound = SwitchClick
