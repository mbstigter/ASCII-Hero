; A playground for ladders and pipes that move, and for ladders and pipes that stay in place but
; whose rungs or hand line keep moving (like an escalator or a rope on a pulley).
;
; Route: climb the rising and sinking ladder onto the first ledge, jump up to the sliding pipe and
; let it carry you over the gap, ride the up-escalator to the high ledge, take the down-escalator
; back down, grab the leftward rope halfway down and let it carry you to the exit ledge.
; Shortcuts from the ground: the pipe elevator (up to the exit ledge) and the ladder ferry
; (rides along the ground, jump from its top to the rope).

[ObjectCodes]
0 = Player
1 = Ground
2 = LadderLift
3 = LedgeOne
4 = PipeShuttle
5 = LedgeTwo
6 = EscalatorUp
7 = LedgeHigh
8 = EscalatorDown
9 = RopeLeft
A = LedgeLow
B = LadderFerry
C = PipeElevator
D = Diamond
E = LevelEnd

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HazardHitEffectClip = hurt
DiedEffectClip = died

; Floor running the full width of the world.
[Ground]
; --- Identity ---
Material = Brick
Width = 100
Height = 1
Kind = StaticObject

; --- Moving ladders and pipes: the whole object travels along a route ---

; Ladder that rises and sinks. At its lowest it reaches the ground; at its highest its top lines
; up with the first ledge, so the player can step off to the right.
[LadderLift]
; --- Identity ---
Asset = Ladder
Clip = default
Kind = KinematicObject
Repeat = 10
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (vertical) ---
PatrolMinY = 12 ; Topmost row of the route (top of the ladder)
PatrolMaxY = 25 ; Bottommost row of the route (top of the ladder)
PatrolInitialDirectionY = Up
PatrolSpeedY = 2 ; Speed in cells/second (always positive)

; Pipe sliding left and right above the gap between the first and second ledge. Jump up to it
; from the first ledge, hang on while it crosses, and drop onto the second ledge.
[PipeShuttle]
; --- Identity ---
Asset = Pipe
Clip = default
Kind = KinematicObject
Repeat = 8
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 24 ; Leftmost column of the route (left end of the pipe)
PatrolMaxX = 46 ; Rightmost column of the route (left end of the pipe)
PatrolInitialDirectionX = Right ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 4 ; Speed in cells/second (always positive)

; Pipe that rises and sinks next to the exit ledge, as a shortcut up from the ground. Jump up to
; it, ride it up, and jump off to the left onto the exit ledge.
[PipeElevator]
; --- Identity ---
Asset = Pipe
Clip = default
Kind = KinematicObject
Repeat = 6
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (vertical) ---
PatrolMinY = 21 ; Topmost row of the route (the pipe's row)
PatrolMaxY = 30 ; Bottommost row of the route (the pipe's row)
PatrolInitialDirectionY = Down ; Up or Down (default = toward the farther end of the route)
PatrolSpeedY = 2 ; Speed in cells/second (always positive)

; Short ladder sliding left and right along the ground. Climb on, ride along, and jump from its
; top to grab the rope above.
[LadderFerry]
; --- Identity ---
Asset = Ladder
Clip = default
Kind = KinematicObject
Repeat = 8
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Patrol ---
Patrol = true ; Moves back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 66 ; Leftmost column of the route (left edge of the ladder)
PatrolMaxX = 88 ; Rightmost column of the route (left edge of the ladder)
PatrolInitialDirectionX = Left ; Left or Right (default = toward the farther end of the route)
PatrolSpeedX = 3 ; Speed in cells/second (always positive)

; --- Escalators and ropes: the object stays in place, but its rungs or hand line keep moving ---

; Up-escalator from the second ledge to the high ledge. Holding on is enough to be carried up;
; climbing up as well gets you there faster.
[EscalatorUp]
; --- Identity ---
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 8
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Up ; Which way the rungs move: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; Down-escalator from the far end of the high ledge all the way to the ground. Halfway down it
; passes the end of the rope.
[EscalatorDown]
; --- Identity ---
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 28
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
; --- Conveyor ---
ConveyorDirection = Down ; Which way the rungs move: Up or Down
ConveyorSpeed = 3 ; Speed in cells/second

; Rope running from the down-escalator to above the exit ledge, pulling anything hanging from it
; to the left. Let go at the left end to land on the exit ledge.
[RopeLeft]
; --- Identity ---
Asset = Pipe
Clip = default
Kind = StaticObject
Repeat = 22
BackgroundColor = 0
; --- Behavior ---
Passable = true ; Can be walked through
Hangable = true ; Can be hung from
; --- Conveyor ---
ConveyorDirection = Left ; Which way the hand line moves: Left or Right
ConveyorSpeed = 4 ; Speed in cells/second

