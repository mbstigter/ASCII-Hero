
[ObjectCodes]
0 = Player
1 = BallRubberOnConcrete
2 = BallPlasticOnConcrete
3 = BallRubberOnGlass
4 = BallPlasticOnGlass
5 = FloorConcrete
6 = FloorGlass
7 = WallGlass
8 = WaterSurface
9 = BodyOfWater

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
WalkForceMultiplier = 40 ; Default = PhysicsSystem.DefaultWalkForceMultiplier
WalkSpeed = 12 ; Default = PhysicsSystem.DefaultWalkSpeed
CrawlSpeed = 6 ; Default = PhysicsSystem.DefaultCrawlSpeed
Mass = ; Default = Density * width * height (no override)
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Two static floor segments side by side - Concrete on the left half, Glass on the right half -
; each hosting its own pair of ball-drop columns above it (see
; BallRubberOnConcrete/BallPlasticOnConcrete/BallRubberOnGlass/BallPlasticOnGlass below). Comparing
; the two halves side by side isolates the floor material as the controlled variable: each
; half's own pair of balls (Rubber vs. Plastic) also lets the ball's material be compared while
; the floor underneath it is held constant.

[FloorConcrete]
Material = Concrete
Width = 40
Height = 2
Kind = StaticObject

[FloorGlass]
Material = Glass
Width = 40
Height = 2
Kind = StaticObject

; All four balls below reuse the one Ball sprite asset, each overriding its material via
; Material as needed. All four are dropped straight down from rest onto their respective floor
; segment, so only each ball/floor material pairing's own combined bounciness/friction drives
; how each one bounces and settles.
; ForegroundColor overrides the Rubber balls' color away from both the shared Ball asset's own
; default and Rubber's own material-default color, so the four balls stay visually distinguishable
; by material at a glance: Plastic balls simply inherit their color from the Plastic material's own
; default (see Global/MaterialLibrary.ini), while Rubber balls need an explicit override here since their
; own material default color would otherwise be too close to Ball's own default red.
[BallRubberOnConcrete]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnConcrete]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic

[BallRubberOnGlass]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnGlass]
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic

[WallGlass]
Material = Glass
Width = 2
Height = 10
Kind = StaticObject

[WaterSurface]
Material = Water
Width = 36
Height = 1
Kind = StaticObject
Passable = true

[BodyOfWater]
Material = Water
Width = 36
Height = 8
Kind = StaticObject
Passable = true
Character = ' '