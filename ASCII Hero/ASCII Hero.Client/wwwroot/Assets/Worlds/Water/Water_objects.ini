
[ObjectCodes]
0 = Player
1 = BallRubberOnConcrete
2 = BallPlasticOnConcrete
3 = BallRubberOnGlass
4 = BallPlasticOnGlass
5 = FloorConcrete
6 = FloorGlass
7 = WallGlass
8 = WaterSurface
9 = BodyOfWater
L = Ladder
D = Duck

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died
WalkForceMultiplier = 22 ; Default = GameDefaults.WalkForceMultiplier
WalkSpeed = 12 ; Default = GameDefaults.WalkSpeed
CrawlSpeed = 6 ; Default = GameDefaults.CrawlSpeed
Friction = ; Default = resolved Material's Friction (no override)
Restitution = ; Default = resolved Material's Restitution (no override)
Density = ; Default = resolved Material's Density (no override)

; Two floor segments side by side: concrete on the left half, glass on the right half. Each has its
; own pair of balls dropped onto it, one rubber and one plastic. Comparing the halves shows the
; effect of the floor material; comparing the balls on one half shows the effect of the ball
; material.
[FloorConcrete]
; --- Identity ---
Material = Concrete
Width = 40
Height = 2
Kind = StaticObject

[FloorGlass]
; --- Identity ---
Material = Glass
Width = 40
Height = 2
Kind = StaticObject

[WallGlass]
; --- Identity ---
Material = Glass
Width = 2
Height = 15
Kind = StaticObject

[Ladder]
; --- Identity ---
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 15
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed

; Water, made of a one-row surface and the body below it drawn empty. Both can be walked and
; swum through.
[WaterSurface]
; --- Identity ---
Material = Water
Width = 36
Height = 1
Kind = StaticObject
; --- Behavior ---
Passable = true ; Can be walked through
Medium = true ; Acts as water (buoyancy and drag)

[BodyOfWater]
; --- Identity ---
Material = Water
Width = 36
Height = 15
Kind = StaticObject
Character = ' '
; --- Behavior ---
Passable = true ; Can be walked through
Medium = true ; Acts as water (buoyancy and drag)

; The four balls share one sprite and are dropped straight down from rest. Plastic balls use the
; plastic color; rubber balls would otherwise look too close to the sprite's default red, so they
; override their color.
[BallRubberOnConcrete]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnConcrete]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic

[BallRubberOnGlass]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Rubber

[BallPlasticOnGlass]
; --- Identity ---
Asset = Ball
Clip = default
Kind = DynamicObject
Material = Plastic

; Duck floating back and forth on the water.
[Duck]
; --- Identity ---
Asset = Duck
Clip = move_idle
Kind = DynamicObject
; --- Patrol ---
Patrol = true ; Patrols back and forth
; --- Patrol (horizontal) ---
PatrolMinX = 42 ; Leftmost column of the route
PatrolMaxX = 75 ; Rightmost column of the route
PatrolInitialDirectionX = Right ; Left or Right (default = toward the farther end of the route)
PatrolCruiseSpeedX = 4 ; Target speed in cells/second (default 6)
