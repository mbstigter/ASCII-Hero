; A short training ground for throwing. Pick up the stones lying on the floor (just walk into
; them) and press the action key (E or Enter) to throw one the way you are facing. Stones bounce
; a little, settle, and can be picked up again. Enemies here take more than one hit: watch them
; blink after a hit they survive. The key opens the wooden door: hold Tab, choose the key in the
; gear ring, release Tab, then press the action key next to the door.

[ObjectCodes]
0 = Player
F = Floor
D = GreenDoor
K = GreenKey
R = Stone
S = ToughSnake
A = FireAnt
B = Killerbee
E = WorldEnd

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
StompDamage = 1 ; How much of an enemy's health one squash from above takes (default 1)

; --- Terrain ---

; Floor running the full width of the world.
[Floor]
Material = Concrete
Width = 100
Height = 1
Kind = StaticObject

; --- Door and key ---

; Wooden door between the two halves of the world, standing on the floor. Opens with the green
; key and the action key, and then stays open.
[GreenDoor]
; --- Identity ---
Asset = Door
Clip = closed
ClipWhenOn = open
Span = 9 ; Length in cells: tall enough that it can't simply be jumped over
Kind = Gate
; --- Lock ---
Lock = Green
Sound = GateUnlock

; Green key, lying just past the stones.
[GreenKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = 9
; --- Pickup ---
Type = Key
Lock = Green ; Opens the wooden door
Sound = KeyPickup

; --- Throwables ---

; A small stone. Walk into it to pick it up; press the action key to throw it. It bounces a few
; times, settles, and can be picked up and thrown again.
[Stone]
; --- Identity ---
Asset = Rock
Clip = small
Kind = ThrowableObject
Gear = Rock ; Carried as gear 'Rock' (listed in the game's gear settings)
; --- Throwing ---
Damage = 0.5 ; How much of an enemy's health a hit takes (default 0.5)
HitSpeed = 5 ; Minimum speed in cells/second at which a hit counts (default 5)
Reusable = true ; Can be picked up again after it lands (default true)
ThrowSpeed = 20 ; Throw speed in cells/second (default 20)
ThrowAngle = 30 ; Throw angle in degrees above horizontal (default 30)
Sound = ThrowableHit ; Played when it hits an enemy
PickupSound = ThrowablePickup ; Played when the player picks it up
; --- Material (default = from the resolved Material) ---
Restitution = 0.4 ; A little bounce, settling after a few hops

; --- Enemies ---

; A tough snake guarding the door: two squashes, or four stones.
[ToughSnake]
; --- Identity ---
Asset = Snake
Clip = move_idle
Kind = DynamicHazard
; --- Combat ---
Damage = 0.5 ; Share of a full health bar removed per hit (default 1 = a whole bar)
Sound = Hurt ; Played when the player is hurt by touching it
Killable = true ; Player can squash it from above
KillSound = HazardKill ; Played when it is defeated
Health = 2 ; How much hurt it takes before it is defeated (default 1)
HurtEffectClip = hurt ; Played on it when it is hurt but survives. Empty = no effect
HurtSound = HazardHurt ; Played when it is hurt but survives
; --- Patrol ---
Patrol = true ; Patrols back and forth
PatrolMinX = 28 ; Leftmost column of the route
PatrolMaxX = 47 ; Rightmost column of the route
PatrolForceMultiplierX = 17 ; How quickly it reaches its speed (default 33)

