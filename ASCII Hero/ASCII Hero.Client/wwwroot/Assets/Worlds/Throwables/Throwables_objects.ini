; A short training ground for throwing. Pick up the stones lying on the floor (just walk into
; them) and press the action key (E or Enter) to throw one the way you are facing. Stones bounce
; a little, settle, and can be picked up again. Enemies here take more than one hit: watch them
; glow after a hit they survive. Spikes by the left wall and in the floor hurt on touch. The key opens the wooden door: hold Tab, choose the key in the
; gear ring, release Tab, then press the action key next to the door.

[ObjectCodes]
0 = Player
F = Floor
D = Door
K = Key
R = Stone
S = Snake
A = FireAnt
B = Killerbee
E = WorldEnd
W = Wall
P = SpikeRight
U = SpikeUp
T = SpikeTimed

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
HurtEffectClip = hurt ; Played on the player when hurt without dying, e.g. a hazard or a hard landing. Empty = no effect
DiedEffectClip = died ; Played on the player when a life is lost. Empty = no effect
StompDamage = 1 ; How much of an enemy's health one squash from above takes (default 1)

