Span = 10 ; Height in cells, down to the floor
Kind = StaticObject

; Spike pointing right, sliding out of the wall for two seconds and back in for two seconds. Place it next to a wall. Jump over it, or time your jump.
[SpikeRight]
; --- Identity ---
Asset = Spike
