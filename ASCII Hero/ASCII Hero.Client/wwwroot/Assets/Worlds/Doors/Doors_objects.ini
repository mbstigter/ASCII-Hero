
[ObjectCodes]
0 = Player
1 = UpperFloorLeft
2 = RedHatch
3 = UpperFloorRight
4 = LowerFloor
5 = RedKey
6 = BlueKey
7 = BlueDoor
8 = ButtonSwitch
9 = ButtonDoor
A = LeverSwitch
B = LeverHatch
C = UpperFloorMid
D = Crate
E = HeavyCrate
L = Ladder

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died

; Left half of the upper platform. The player drops onto it at the start. The red hatch fills the
; gap between the two halves, so the lower platform is out of reach until the hatch is opened.
[UpperFloorLeft]
; --- Identity ---
Material = Wood
Width = 20
Height = 1
Kind = StaticObject

; Right half of the upper platform.
[UpperFloorRight]
; --- Identity ---
Material = Wood
Width = 26
Height = 1
Kind = StaticObject

; Upper platform section between the lever hatch and the red hatch.
[UpperFloorMid]
; --- Identity ---
Material = Wood
Width = 12
Height = 1
Kind = StaticObject

; Lower platform, reached by dropping through the opened red hatch.
[LowerFloor]
; --- Identity ---
Material = Wood
Width = 80
Height = 1
Kind = StaticObject

[Ladder]
; --- Identity ---
Asset = Ladder
Clip = vertical
Kind = StaticObject
Span = 15 ; Length in cells
; --- Behavior ---
Passable = true ; Can be walked through
Climbable = true ; Can be climbed
BackgroundColor = 0

; Floor hatch. Stays shut until the player holds the red key and presses the action key
; (E or Enter) while standing on or next to it. Opening it uses up the red key, and it then stays
; open.
[RedHatch]
; --- Identity ---
Asset = Hatch
Clip = closed
OnClip = open
Span = 8 ; Length in cells
Kind = Gate
ForegroundColor = L
; --- Lock ---
Lock = Red
Sound = DoorOpen

; Door blocking the way along the lower platform. Stays shut until the player holds the blue
; key and presses the action key (E or Enter) next to it. Opening it uses up the blue key, and
; it then stays open.
[BlueDoor]
; --- Identity ---
Asset = Door
Clip = closed
OnClip = open
Span = 8 ; Length in cells
Kind = Gate
ForegroundColor = I
; --- Lock ---
Lock = Blue
Sound = DoorOpen

; Door opened by the button. It needs no key.
[ButtonDoor]
; --- Identity ---
Asset = Door
Clip = closed
OnClip = open
Span = 8 ; Length in cells
Kind = Gate
ForegroundColor = U
; --- Link ---
Link = GreyDoor ; Opened and closed by the switch with the same link

; Hatch in the upper platform, opened and closed by the lever. It needs no key.
[LeverHatch]
; --- Identity ---
Asset = Hatch
Clip = closed
OnClip = open
Span = 8 ; Length in cells
Kind = Gate
ForegroundColor = U
; --- Link ---
Link = GreyHatch ; Opened and closed by the switch with the same link

; Red key.
[RedKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = L
; --- Pickup ---
Type = Key
Lock = Red ; Opens the red hatch
Sound = KeyPickup

; Blue key, lying on the lower platform. It can be jumped over to leave it behind.
[BlueKey]
; --- Identity ---
Asset = Key
Clip = default
Kind = Collectable
ForegroundColor = I
; --- Pickup ---
Type = Key
Lock = Blue ; Opens the blue door
Sound = KeyPickup

; Button on the lower platform. Press the action key (E or Enter) next to it to open the grey
; door; press it again to close the door.
[ButtonSwitch]
; --- Identity ---
Asset = Button
Clip = off
OnClip = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once pressed; false = every press toggles it
Link = GreyDoor
Sound = SwitchClick

; Lever on the upper platform. Press the action key (E or Enter) next to it to open the hatch
; in the upper platform; press it again to close the hatch.
[LeverSwitch]
; --- Identity ---
Asset = Lever
Clip = off
OnClip = on
Kind = Switch
; --- Switch ---
Latching = false ; true = stays on once operated; false = every operation toggles it
Link = GreyHatch
Sound = SwitchClick

; Wooden crate. A loose body that can be pushed, climbed and knocked over. Placed on a hatch, it
; drops through as soon as the hatch opens.
[Crate]
; --- Identity ---
Asset = Crate
Kind = DynamicObject

; Same crate, but packed with heavier cargo and darker.
[HeavyCrate]
; --- Identity ---
Asset = Crate
Kind = DynamicObject
ForegroundColor = 9
BackgroundColor = 8
; --- Physics ---
Density = 7 ; about 10 times the player's weight - only just pushable, stays put when walked on
