
[ObjectCodes]
0 = Player
1 = UpperFloorLeft
2 = RedHatch
3 = UpperFloorRight
4 = LowerFloor
5 = RedKey
6 = BlueKey
7 = BlueDoor
8 = ButtonSwitch
9 = ButtonDoor
A = LeverSwitch
B = LeverHatch
C = UpperFloorMid
L = Ladder

[Player]
Asset = Player
Clip = walk_idle
Kind = Player
DiedEffectClip = died

; Upper platform. The player drops onto it at the start. It is split in two halves with the
; red hatch filling the gap between them, so the player can't get to the lower platform until
; the hatch has been opened.
[UpperFloorLeft]
Material = Wood
Width = 20
Height = 1
Kind = StaticObject

[UpperFloorRight]
Material = Wood
Width = 26
Height = 1
Kind = StaticObject

; Floor hatch. Stays shut until the player holds the red key and presses the action key
; (E or Enter) while standing on or next to it. Opening it uses up the red key, and it then stays
; open.
[RedHatch]
Asset = Hatch
Clip = closed
OnClip = open
Repeat = 8
Kind = Gate
ForegroundColor = L
Lock = Red
Sound = DoorOpen

; Red key,
[RedKey]
Asset = Key
Clip = default
Kind = Collectable
Type = Key
Lock = Red
Sound = KeyPickup
ForegroundColor = L

; Lower platform, reached by dropping through the opened red hatch.
[LowerFloor]
Material = Wood
Width = 80
Height = 1
Kind = StaticObject

; Blue key, lying on the lower platform. It can be jumped over to leave it behind.
[BlueKey]
Asset = Key
Clip = default
Kind = Collectable
Type = Key
Lock = Blue
Sound = KeyPickup
ForegroundColor = I

; Door blocking the way along the lower platform. Stays shut until the player holds the blue
; key and presses the action key (E or Enter) next to it. Opening it uses up the blue key, and
; it then stays open.
[BlueDoor]
Asset = Door
Clip = closed
OnClip = open
Repeat = 8
Kind = Gate
ForegroundColor = I
Lock = Blue
Sound = DoorOpen

; Button on the lower platform. Press the action key (E or Enter) next to it to open the grey
; door; press it again to close the door.
[ButtonSwitch]
Asset = Button
Clip = off
OnClip = on
Kind = Switch
; Latching = true makes the switch stay on once pressed (it can't be turned off again);
; false (the default) makes every press toggle it between off and on.
Latching = false
Link = GreyDoor
Sound = SwitchClick

; Door opened by the button. It needs no key.
[ButtonDoor]
Asset = Door
Clip = closed
OnClip = open
Repeat = 8
Kind = Gate
ForegroundColor = U
Link = GreyDoor

; Lever on the upper platform. Press the action key (E or Enter) next to it to open the hatch
; in the upper platform; press it again to close the hatch.
[LeverSwitch]
Asset = Lever
Clip = off
OnClip = on
Kind = Switch
; Latching = true makes the switch stay on once operated (it can't be turned off again);
; false (the default) makes every operation toggle it between off and on.
Latching = false
Link = GreyHatch
Sound = SwitchClick

; Hatch in the upper platform, opened and closed by the lever. It needs no key.
[LeverHatch]
Asset = Hatch
Clip = closed
OnClip = open
Repeat = 8
Kind = Gate
ForegroundColor = U
Link = GreyHatch

; Upper platform section between the lever hatch and the red hatch.
[UpperFloorMid]
Material = Wood
Width = 12
Height = 1
Kind = StaticObject

[Ladder]
Asset = Ladder
Clip = default
Kind = StaticObject
Repeat = 15
Passable = true
Climbable = true
BackgroundColor = 0